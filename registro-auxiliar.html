<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Registrar Auxiliar - Academia BALAM</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeInDown 0.5s ease;
        }
        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .header h1 {
            color: #FFD700;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header p {
            color: #aaa;
            font-size: 13px;
            margin-top: 5px;
        }

        /* Tarjeta principal */
        .card {
            background: #1a1a1a;
            border-radius: 28px;
            border: 1px solid #FFD700;
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Sección foto */
        .foto-section {
            background: linear-gradient(135deg, #0f0f0f 0%, #151515 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .foto-title {
            color: #FFD700;
            font-size: 14px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .foto-preview {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            background: #0a0a0a;
            border-radius: 50%;
            border: 3px solid #FFD700;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .foto-preview:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }
        .foto-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .foto-placeholder {
            font-size: 50px;
            color: #555;
        }
        .btn-foto-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-foto {
            background: #2a2a2a;
            border: 1px solid #FFD700;
            padding: 8px 20px;
            border-radius: 30px;
            color: #FFD700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-foto:hover {
            background: #FFD700;
            color: #000;
            transform: translateY(-2px);
        }

        /* Formulario */
        .form-section {
            padding: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #FFD700;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        label .required {
            color: #ff6666;
        }
        label .opcional {
            color: #888;
            font-weight: normal;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #FFD700;
            background: #2a2a2a;
            box-shadow: 0 0 8px rgba(255,215,0,0.2);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .separator {
            height: 1px;
            background: #333;
            margin: 20px 0 18px 0;
            position: relative;
        }
        .separator span {
            display: block;
            text-align: center;
            color: #FFD700;
            font-size: 11px;
            background: #1a1a1a;
            width: fit-content;
            margin: -8px auto 0;
            padding: 0 15px;
            letter-spacing: 2px;
        }
        .usuario-card {
            background: linear-gradient(135deg, #1a2a1a 0%, #0f1a0f 100%);
            border: 1px solid #FFD700;
            border-radius: 16px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }
        .usuario-label {
            font-size: 11px;
            color: #FFD700;
            letter-spacing: 1px;
        }
        .usuario-value {
            font-size: 22px;
            font-weight: bold;
            color: #FFD700;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .btn-registrar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-registrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }

        /* Loader */
        .loader-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 25px;
        }
        .loader-logo {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }
        .light-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: transparent;
            z-index: 1;
        }
        .light-ring::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #FFD700, #FFA500, transparent);
            animation: rotateLight 1.5s linear infinite;
        }
        .light-ring::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: #0a0a0a;
            border-radius: 50%;
        }
        @keyframes rotateLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            color: #FFD700;
            font-size: 16px;
            font-weight: bold;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Modal de éxito */
        .modal-exito {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 28px;
            border: 2px solid #00ff00;
            max-width: 400px;
            width: 90%;
            padding: 35px 25px;
            text-align: center;
            animation: fadeInUp 0.3s ease;
        }
        .modal-icon { font-size: 70px; margin-bottom: 15px; }
        .modal-content h2 { color: #00ff00; font-size: 26px; margin-bottom: 20px; }
        .info-box {
            background: #0a0a0a;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .info-box p {
            color: #FFD700;
            margin: 12px 0;
            font-size: 13px;
            word-break: break-all;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn-modal-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-modal-secondary {
            background: #2a2a2a;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 550px) {
            .row { grid-template-columns: 1fr; gap: 0; }
            .form-section { padding: 20px; }
            .foto-preview { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        <h1>👥 REGISTRO DE AUXILIAR</h1>
        <p>Ingrese los datos del nuevo empleado o instructor</p>
    </div>

    <div class="card">
        <!-- SECCIÓN FOTO -->
        <div class="foto-section">
            <div class="foto-title">📸 FOTO DEL EMPLEADO</div>
            <div class="foto-preview" id="fotoPreview" onclick="subirFoto()">
                <div class="foto-placeholder" id="fotoPlaceholder">📷</div>
            </div>
            <div class="btn-foto-group">
                <button type="button" class="btn-foto" onclick="tomarFoto()">📸 Tomar foto</button>
                <button type="button" class="btn-foto" onclick="subirFoto()">🖼️ Subir imagen</button>
            </div>
        </div>

        <!-- FORMULARIO -->
        <div class="form-section">
            <!-- Datos personales -->
            <div class="row">
                <div class="form-group">
                    <label>NOMBRE(S) <span class="required">*</span></label>
                    <input type="text" id="nombre" placeholder="Ej. María">
                </div>
                <div class="form-group">
                    <label>APELLIDO PATERNO <span class="required">*</span></label>
                    <input type="text" id="apellidoPaterno" placeholder="Ej. González">
                </div>
            </div>
            <div class="form-group">
                <label>APELLIDO MATERNO <span class="opcional">(Opcional)</span></label>
                <input type="text" id="apellidoMaterno" placeholder="Ej. López">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>📱 TELÉFONO <span class="required">*</span></label>
                    <input type="tel" id="telefono" placeholder="55 1234 5678">
                </div>
                <div class="form-group">
                    <label>📧 EMAIL <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="empleado@academia.com">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>🎂 FECHA DE NACIMIENTO <span class="required">*</span></label>
                    <input type="date" id="fechaNacimiento">
                </div>
                <div class="form-group">
                    <label>🆔 CURP (Opcional)</label>
                    <input type="text" id="curp" placeholder="GOGM900101MDFRRN09" style="text-transform: uppercase;">
                </div>
            </div>

            <!-- Datos laborales -->
            <div class="separator"><span>💼 DATOS LABORALES</span></div>

            <div class="row">
                <div class="form-group">
                    <label>PUESTO <span class="required">*</span></label>
                    <select id="puesto">
                        <option value="">Seleccionar...</option>
                        <option value="INSTRUCTOR">INSTRUCTOR</option>
                        <option value="RECEPCIONISTA">RECEPCIONISTA</option>
                        <option value="COORDINADOR">COORDINADOR</option>
                        <option value="ASISTENTE">ASISTENTE</option>
                        <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ROL <span class="required">*</span></label>
                    <select id="rol">
                        <option value="">Seleccionar...</option>
                        <option value="auxiliar">AUXILIAR</option>
                        <option value="instructor">INSTRUCTOR</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>DISCIPLINA (si aplica)</label>
                    <select id="disciplina">
                        <option value="">Seleccionar...</option>
                        <option value="ENTRENAMIENTO FUNCIONAL">ENTRENAMIENTO FUNCIONAL</option>
                        <option value="ZUMBA">ZUMBA</option>
                        <option value="PILATES">PILATES</option>
                        <option value="TAEWONDO">TAEWONDO</option>
                        <option value="BOX">BOX</option>
                        <option value="KICK BOXING">KICK BOXING</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>HORARIO LABORAL</label>
                    <input type="text" id="horario" placeholder="Ej. 9:00 - 18:00">
                </div>
            </div>

            <!-- Contacto de emergencia -->
            <div class="separator"><span>🆘 EMERGENCIA</span></div>

            <div class="row">
                <div class="form-group">
                    <label>NOMBRE CONTACTO <span class="required">*</span></label>
                    <input type="text" id="emergenciaNombre" placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label>TELÉFONO EMERGENCIA <span class="required">*</span></label>
                    <input type="tel" id="emergenciaTelefono" placeholder="55 9876 5432">
                </div>
            </div>
            <div class="form-group">
                <label>PARENTESCO <span class="required">*</span></label>
                <input type="text" id="emergenciaParentesco" placeholder="Ej. Esposo, Padre, Hermano">
            </div>

            <!-- Datos de acceso -->
            <div class="separator"><span>🔐 ACCESO AL SISTEMA</span></div>

            <div id="usuarioPreview" class="usuario-card" style="display: none;">
                <div class="usuario-label">👤 USUARIO GENERADO</div>
                <div class="usuario-value" id="usuarioGenerado"></div>
                <div style="font-size: 10px; color: #888; margin-top: 5px;">El empleado usará este usuario para iniciar sesión</div>
            </div>

            <div class="form-group">
                <label>CONTRASEÑA <span class="required">*</span></label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
            </div>

            <button class="btn-registrar" id="btnRegistrar" onclick="registrarAuxiliar()">
                👥 REGISTRAR AUXILIAR
            </button>
        </div>
    </div>
</div>

<!-- LOADER -->
<div id="loaderOverlay" class="loader-overlay">
    <div class="loader-logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <div class="light-ring"></div>
    </div>
    <div class="loader-text">REGISTRANDO AUXILIAR...</div>
</div>

<!-- MODAL DE ÉXITO -->
<div id="modalExito" class="modal-exito">
    <div class="modal-content">
        <div class="modal-icon">✅</div>
        <h2>¡AUXILIAR REGISTRADO!</h2>
        <div class="info-box" id="modalInfo"></div>
        <div class="modal-buttons">
            <button class="btn-modal-primary" onclick="registrarOtro()">📝 REGISTRAR OTRO</button>
            <button class="btn-modal-secondary" onclick="irPanelPrincipal()">🏠 IR AL PANEL</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let fotoFile = null;
    let fotoDataURL = null;

    function generarUsuario() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const ap = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        if (nombre && ap) {
            const usuario = nombre.charAt(0) + ap;
            document.getElementById('usuarioGenerado').textContent = usuario;
            document.getElementById('usuarioPreview').style.display = 'block';
            return usuario;
        }
        document.getElementById('usuarioPreview').style.display = 'none';
        return null;
    }

    // Convertir a mayúsculas campos de texto
    const camposMayusculas = ['nombre', 'apellidoPaterno', 'apellidoMaterno', 'curp', 'horario', 'emergenciaNombre', 'emergenciaParentesco'];
    camposMayusculas.forEach(id => {
        const elemento = document.getElementById(id);
        if (elemento) {
            elemento.addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });
        }
    });

    document.getElementById('nombre').addEventListener('input', generarUsuario);
    document.getElementById('apellidoPaterno').addEventListener('input', generarUsuario);

    // Función para redimensionar imagen
    function resizeImage(base64, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                if (width > maxWidth) {
                    height = (height * maxWidth) / width;
                    width = maxWidth;
                }
                
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                const resizedBase64 = canvas.toDataURL('image/jpeg', quality);
                resolve(resizedBase64);
            };
            img.onerror = reject;
            img.src = base64;
        });
    }

    function tomarFoto() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = (e) => procesarFoto(e.target.files[0]);
        input.click();
    }

    function subirFoto() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => procesarFoto(e.target.files[0]);
        input.click();
    }

    async function procesarFoto(file) {
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                const resizedImage = await resizeImage(event.target.result, 800, 0.7);
                fotoDataURL = resizedImage;
                document.getElementById('fotoPreview').innerHTML = `<img src="${fotoDataURL}" alt="Foto">`;
                console.log('✅ Foto procesada');
            } catch (error) {
                console.error('Error:', error);
            }
        };
        reader.readAsDataURL(file);
    }

    function mostrarLoader(mostrar) {
        document.getElementById('loaderOverlay').style.display = mostrar ? 'flex' : 'none';
    }

    function mostrarModal(email, usuario, password, nombre) {
        document.getElementById('modalInfo').innerHTML = `
            <p>👤 <strong>Nombre:</strong> ${nombre}</p>
            <p>📧 <strong>Email:</strong> ${email}</p>
            <p>👤 <strong>Usuario:</strong> ${usuario}</p>
            <p>🔑 <strong>Contraseña:</strong> ${password}</p>
            <p>✅ <strong>Estado:</strong> ACTIVO</p>
            <p>📁 <strong>Guardado en:</strong> Authentication + Firestore</p>
        `;
        document.getElementById('modalExito').style.display = 'flex';
    }

    function registrarOtro() {
        document.getElementById('modalExito').style.display = 'none';
        document.getElementById('nombre').value = '';
        document.getElementById('apellidoPaterno').value = '';
        document.getElementById('apellidoMaterno').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('email').value = '';
        document.getElementById('fechaNacimiento').value = '';
        document.getElementById('curp').value = '';
        document.getElementById('puesto').value = '';
        document.getElementById('rol').value = '';
        document.getElementById('disciplina').value = '';
        document.getElementById('horario').value = '';
        document.getElementById('emergenciaNombre').value = '';
        document.getElementById('emergenciaTelefono').value = '';
        document.getElementById('emergenciaParentesco').value = '';
        document.getElementById('password').value = '';
        document.getElementById('fotoPreview').innerHTML = '<div class="foto-placeholder" id="fotoPlaceholder">📷</div>';
        document.getElementById('usuarioPreview').style.display = 'none';
        fotoDataURL = null;
        document.getElementById('btnRegistrar').disabled = false;
        document.getElementById('btnRegistrar').textContent = '👥 REGISTRAR AUXILIAR';
    }

    function irPanelPrincipal() {
        window.location.href = 'panel-admin.html';
    }

    async function registrarAuxiliar() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const apPaterno = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        const apMaterno = document.getElementById('apellidoMaterno').value.trim().toUpperCase();
        const telefono = document.getElementById('telefono').value.trim();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const fechaNacimiento = document.getElementById('fechaNacimiento').value;
        const curp = document.getElementById('curp').value.trim().toUpperCase();
        const puesto = document.getElementById('puesto').value;
        const rol = document.getElementById('rol').value;
        const disciplina = document.getElementById('disciplina').value;
        const horario = document.getElementById('horario').value.trim().toUpperCase();
        const emergenciaNombre = document.getElementById('emergenciaNombre').value.trim().toUpperCase();
        const emergenciaTelefono = document.getElementById('emergenciaTelefono').value.trim();
        const emergenciaParentesco = document.getElementById('emergenciaParentesco').value.trim().toUpperCase();
        const password = document.getElementById('password').value;
        const usuario = generarUsuario();

        if (!nombre || !apPaterno || !telefono || !email || !fechaNacimiento || !puesto || !rol || !emergenciaNombre || !emergenciaTelefono || !emergenciaParentesco || !password) {
            alert('❌ COMPLETA TODOS LOS CAMPOS OBLIGATORIOS');
            return;
        }

        if (password.length < 6) {
            alert('❌ LA CONTRASEÑA DEBE TENER AL MENOS 6 CARACTERES');
            return;
        }

        mostrarLoader(true);
        document.getElementById('btnRegistrar').disabled = true;

        try {
            // 1. Crear usuario en Authentication
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const uid = userCredential.user.uid;
            console.log('✅ Usuario creado en Auth');

            // 2. Subir foto a Storage
            let fotoURL = '';
            if (fotoDataURL) {
                const storageRef = storage.ref().child(`fotos_auxiliares/${uid}.jpg`);
                await storageRef.putString(fotoDataURL, 'data_url');
                fotoURL = await storageRef.getDownloadURL();
                console.log('✅ Foto subida');
            }

            // 3. Guardar en Firestore
            await db.collection('auxiliares').doc(uid).set({
                uid: uid,
                usuario: usuario,
                nombre: nombre,
                apellidoPaterno: apPaterno,
                apellidoMaterno: apMaterno || '',
                telefono: telefono,
                email: email,
                fechaNacimiento: fechaNacimiento,
                curp: curp || '',
                puesto: puesto,
                rol: rol,
                disciplina: disciplina || '',
                horario: horario || '',
                contactoEmergencia: {
                    nombre: emergenciaNombre,
                    telefono: emergenciaTelefono,
                    parentesco: emergenciaParentesco
                },
                estado: 'activo',
                fotoURL: fotoURL,
                fechaRegistro: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log('✅ Auxiliar guardado en Firestore');

            await auth.signOut();
            
            mostrarLoader(false);
            mostrarModal(email, usuario, password, `${nombre} ${apPaterno}`);

        } catch (error) {
            console.error('❌ Error:', error);
            mostrarLoader(false);
            let mensaje = '';
            if (error.code === 'auth/email-already-in-use') {
                mensaje = '❌ ESTE EMAIL YA ESTÁ REGISTRADO';
            } else {
                mensaje = '❌ ERROR: ' + error.message;
            }
            alert(mensaje);
            document.getElementById('btnRegistrar').disabled = false;
            document.getElementById('btnRegistrar').textContent = '👥 REGISTRAR AUXILIAR';
        }
    }
</script>

</body>
</html>
