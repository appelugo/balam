<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gestión de Alumnos - Academia BALAM</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #FFD700;
        }
        .header h1 {
            color: #FFD700;
            font-size: 24px;
        }
        .btn-cerrar {
            background: #2a2a2a;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-cerrar:hover {
            background: #FFD700;
            color: #000;
            transform: scale(1.02);
        }

        /* Buscador */
        .buscador {
            margin-bottom: 25px;
        }
        .buscador input {
            width: 100%;
            padding: 14px 20px;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            transition: all 0.2s;
        }
        .buscador input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
        .buscador input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #252525 inset !important;
            -webkit-text-fill-color: white !important;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .stats span {
            background: linear-gradient(135deg, #1a1a1a 0%, #222 100%);
            padding: 8px 18px;
            border-radius: 30px;
            color: #FFD700;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #333;
        }

        /* Grid de tarjetas */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Tarjeta individual */
        .card-alumno {
            background: linear-gradient(135deg, #1a1a1a 0%, #1f1f1f 100%);
            border-radius: 20px;
            border: 1px solid #333;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.4s ease-out forwards;
            opacity: 0;
        }

        .card-alumno:hover {
            transform: translateY(-5px);
            border-color: #FFD700;
            box-shadow: 0 10px 25px rgba(255,215,0,0.15);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header de la tarjeta */
        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background: linear-gradient(135deg, #0f0f0f 0%, #151515 100%);
            border-bottom: 1px solid #2a2a2a;
        }
        .card-foto {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #FFD700;
            background: #0a0a0a;
        }
        .card-foto-placeholder {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #666;
            border: 2px solid #FFD700;
        }
        .card-info {
            flex: 1;
        }
        .card-nombre {
            color: #FFD700;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .card-usuario {
            color: #888;
            font-size: 11px;
        }

        /* Cuerpo de la tarjeta */
        .card-body {
            padding: 15px 18px;
        }
        .card-field {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .card-field-label {
            color: #888;
            font-weight: 500;
        }
        .card-field-value {
            color: #ddd;
            font-weight: 600;
        }
        .estado-activo {
            color: #0f0;
            background: rgba(0,255,0,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        .estado-inactivo {
            color: #f66;
            background: rgba(255,0,0,0.15);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
        }

        /* Botones de acción */
        .card-actions {
            display: flex;
            gap: 12px;
            padding: 15px 18px;
            border-top: 1px solid #2a2a2a;
            background: #151515;
        }
        .btn-accion {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-editar {
            background: rgba(255,215,0,0.15);
            color: #FFD700;
            border: 1px solid #FFD700;
        }
        .btn-editar:hover {
            background: #FFD700;
            color: #000;
            transform: scale(1.02);
        }
        .btn-eliminar {
            background: rgba(255,102,102,0.15);
            color: #ff6666;
            border: 1px solid #ff6666;
        }
        .btn-eliminar:hover {
            background: #ff6666;
            color: #000;
            transform: scale(1.02);
        }

        /* MODAL (sin scroll de fondo) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #1f1f1f 100%);
            border-radius: 28px;
            border: 1px solid #FFD700;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 0;
            position: relative;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid #333;
            background: #0f0f0f;
            border-radius: 28px 28px 0 0;
        }
        .modal-header h2 {
            color: #FFD700;
            font-size: 22px;
        }
        .modal-close {
            background: #2a2a2a;
            border: none;
            color: #FFD700;
            font-size: 24px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: #FFD700;
            color: #000;
            transform: scale(1.05);
        }
        .modal-body {
            padding: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: #FFD700;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 8px rgba(255,215,0,0.2);
        }
        .foto-modal {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .foto-modal img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #FFD700;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        .btn-guardar {
            background: #FFD700;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s;
        }
        .btn-guardar:hover {
            transform: scale(1.02);
        }
        .btn-cancelar {
            background: #333;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 12px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s;
        }
        .btn-cancelar:hover {
            background: #FFD700;
            color: #000;
        }

        /* Modal de confirmación */
        .confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 2100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .confirm-modal.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }
        .confirm-modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #1f1f1f 100%);
            border-radius: 28px;
            border: 2px solid #ff6666;
            max-width: 350px;
            width: 90%;
            padding: 30px 25px;
            text-align: center;
        }
        .confirm-modal-content h3 {
            color: #ff6666;
            margin-bottom: 15px;
        }
        .confirm-modal-content p {
            color: #ddd;
            margin-bottom: 20px;
        }
        .confirm-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn-confirmar-si {
            background: #ff6666;
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-confirmar-no {
            background: #333;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .cargando {
            text-align: center;
            color: #FFD700;
            padding: 60px;
            font-size: 18px;
        }

        /* Evitar scroll en body cuando modal está abierto */
        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 700px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .card-header {
                padding: 14px;
            }
            .card-body {
                padding: 12px 14px;
            }
            .card-actions {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>👨‍🎓 GESTIÓN DE ALUMNOS</h1>
        <button class="btn-cerrar" onclick="window.close()">✖️ Cerrar</button>
    </div>

    <div class="buscador">
        <input type="text" id="searchInput" 
               placeholder="🔍 Buscar por nombre, email o teléfono..." 
               autocomplete="off"
               autofill="off"
               name="searchfield"
               spellcheck="false">
    </div>

    <div class="stats">
        <span id="totalCount">📊 Total: 0</span>
        <span id="activosCount">✅ Activos: 0</span>
        <span id="inactivosCount">❌ Inactivos: 0</span>
    </div>

    <div id="cardsContainer" class="cards-grid">
        <div class="cargando">⏳ Cargando alumnos...</div>
    </div>
</div>

<!-- MODAL DE EDICIÓN -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>✏️ EDITAR ALUMNO</h2>
            <button class="modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editUid">
            
            <div class="foto-modal" id="modalFoto"></div>
            
            <div class="form-group">
                <label>NOMBRE(S)</label>
                <input type="text" id="editNombre" style="text-transform: uppercase;" autocomplete="off">
            </div>
            <div class="form-group">
                <label>APELLIDO PATERNO</label>
                <input type="text" id="editApellidoPaterno" style="text-transform: uppercase;" autocomplete="off">
            </div>
            <div class="form-group">
                <label>APELLIDO MATERNO</label>
                <input type="text" id="editApellidoMaterno" style="text-transform: uppercase;" autocomplete="off">
            </div>
            <div class="form-group">
                <label>TELÉFONO</label>
                <input type="tel" id="editTelefono" autocomplete="off">
            </div>
            <div class="form-group">
                <label>EMAIL</label>
                <input type="email" id="editEmail" autocomplete="off">
            </div>
            <div class="form-group">
                <label>FECHA DE NACIMIENTO</label>
                <input type="date" id="editFechaNacimiento" autocomplete="off">
            </div>
            <div class="form-group">
                <label>TELÉFONO EMERGENCIA 1</label>
                <input type="tel" id="editEmergencia1" autocomplete="off">
            </div>
            <div class="form-group">
                <label>TELÉFONO EMERGENCIA 2 (opcional)</label>
                <input type="tel" id="editEmergencia2" autocomplete="off">
            </div>
            <div class="form-group">
                <label>MÉTODO DE PAGO</label>
                <select id="editMetodoPago">
                    <option value="CLASE">CLASE</option>
                    <option value="PAGO">PAGO</option>
                </select>
            </div>
            <div class="form-group">
                <label>ESTADO</label>
                <select id="editEstado">
                    <option value="activo">ACTIVO</option>
                    <option value="inactivo">INACTIVO</option>
                </select>
            </div>
            <div class="form-group">
                <label>🔑 NUEVA CONTRASEÑA (dejar vacío para no cambiar)</label>
                <input type="password" id="editContrasena" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>
            <div class="modal-buttons">
                <button class="btn-guardar" onclick="guardarCambios()">💾 GUARDAR</button>
                <button class="btn-cancelar" onclick="cerrarModal()">CANCELAR</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE CONFIRMACIÓN DE ELIMINACIÓN -->
<div id="confirmDeleteModal" class="confirm-modal">
    <div class="confirm-modal-content">
        <h3>⚠️ ELIMINAR ALUMNO</h3>
        <p id="deleteMessage">¿Estás seguro de que deseas eliminar este alumno?</p>
        <p style="font-size: 12px; color:#888;">Esta acción no se puede deshacer.</p>
        <div class="confirm-buttons">
            <button class="btn-confirmar-si" onclick="confirmarEliminar()">SÍ, ELIMINAR</button>
            <button class="btn-confirmar-no" onclick="cerrarConfirmarModal()">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let allAlumnos = [];
    let filteredAlumnos = [];
    let alumnoAEliminar = null;

    // Bloquear scroll cuando modal está abierto
    function toggleBodyScroll(bloquear) {
        if (bloquear) {
            document.body.classList.add('modal-open');
        } else {
            document.body.classList.remove('modal-open');
        }
    }

    async function cargarAlumnos() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '<div class="cargando">⏳ Cargando alumnos...</div>';
        
        try {
            const snapshot = await db.collection('alumnos').get();
            allAlumnos = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                allAlumnos.push({
                    id: doc.id,
                    ...data
                });
            });
            filteredAlumnos = [...allAlumnos];
            actualizarStats();
            renderizarTarjetas();
        } catch (error) {
            console.error('Error al cargar:', error);
            container.innerHTML = '<div class="cargando" style="color:#f66;">❌ Error al cargar alumnos</div>';
        }
    }

    function actualizarStats() {
        const total = allAlumnos.length;
        const activos = allAlumnos.filter(a => a.estado === 'activo').length;
        const inactivos = total - activos;
        document.getElementById('totalCount').innerHTML = `📊 Total: ${total}`;
        document.getElementById('activosCount').innerHTML = `✅ Activos: ${activos}`;
        document.getElementById('inactivosCount').innerHTML = `❌ Inactivos: ${inactivos}`;
    }

    function filtrarAlumnos() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!searchTerm) {
            filteredAlumnos = [...allAlumnos];
        } else {
            filteredAlumnos = allAlumnos.filter(alumno => 
                (alumno.nombre || '').toLowerCase().includes(searchTerm) ||
                (alumno.email || '').toLowerCase().includes(searchTerm) ||
                (alumno.telefono || '').includes(searchTerm)
            );
        }
        renderizarTarjetas();
    }

    function getFotoHTML(alumno) {
        if (alumno.fotoBase64 && alumno.fotoBase64.startsWith('data:image')) {
            return `<img src="${alumno.fotoBase64}" class="card-foto" alt="foto">`;
        } else {
            return `<div class="card-foto-placeholder">📷</div>`;
        }
    }

    function renderizarTarjetas() {
        const container = document.getElementById('cardsContainer');
        if (filteredAlumnos.length === 0) {
            container.innerHTML = '<div class="cargando">📭 No se encontraron alumnos</div>';
            return;
        }

        let html = '';
        filteredAlumnos.forEach((alumno, index) => {
            const nombreCompleto = `${alumno.nombre || ''} ${alumno.apellidoPaterno || ''} ${alumno.apellidoMaterno || ''}`.trim();
            const estadoClass = alumno.estado === 'activo' ? 'estado-activo' : 'estado-inactivo';
            const estadoText = alumno.estado === 'activo' ? 'ACTIVO' : 'INACTIVO';
            const fotoHTML = getFotoHTML(alumno);
            
            html += `
                <div class="card-alumno" style="animation-delay: ${index * 0.03}s">
                    <div class="card-header">
                        ${fotoHTML}
                        <div class="card-info">
                            <div class="card-nombre">${nombreCompleto}</div>
                            <div class="card-usuario">👤 ${alumno.usuario || ''}</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-field">
                            <span class="card-field-label">📧 Email:</span>
                            <span class="card-field-value">${alumno.email || ''}</span>
                        </div>
                        <div class="card-field">
                            <span class="card-field-label">📱 Teléfono:</span>
                            <span class="card-field-value">${alumno.telefono || ''}</span>
                        </div>
                        <div class="card-field">
                            <span class="card-field-label">🆘 Emergencia:</span>
                            <span class="card-field-value">${alumno.telefonoEmergencia1 || ''}</span>
                        </div>
                        <div class="card-field">
                            <span class="card-field-label">💳 Método pago:</span>
                            <span class="card-field-value">${alumno.metodoPago || 'CLASE'}</span>
                        </div>
                        <div class="card-field">
                            <span class="card-field-label">📌 Estado:</span>
                            <span class="card-field-value ${estadoClass}">${estadoText}</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-accion btn-editar" onclick="abrirModal('${alumno.id}')">
                            ✏️ EDITAR
                        </button>
                        <button class="btn-accion btn-eliminar" onclick="preguntarEliminar('${alumno.id}', '${nombreCompleto.replace(/'/g, "\\'")}')">
                            🗑️ ELIMINAR
                        </button>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }

    let alumnoEditando = null;

    async function abrirModal(uid) {
        const doc = await db.collection('alumnos').doc(uid).get();
        if (!doc.exists) return;
        
        alumnoEditando = { id: doc.id, ...doc.data() };
        
        document.getElementById('editUid').value = alumnoEditando.id;
        document.getElementById('editNombre').value = alumnoEditando.nombre || '';
        document.getElementById('editApellidoPaterno').value = alumnoEditando.apellidoPaterno || '';
        document.getElementById('editApellidoMaterno').value = alumnoEditando.apellidoMaterno || '';
        document.getElementById('editTelefono').value = alumnoEditando.telefono || '';
        document.getElementById('editEmail').value = alumnoEditando.email || '';
        document.getElementById('editFechaNacimiento').value = alumnoEditando.fechaNacimiento || '';
        document.getElementById('editEmergencia1').value = alumnoEditando.telefonoEmergencia1 || '';
        document.getElementById('editEmergencia2').value = alumnoEditando.telefonoEmergencia2 || '';
        document.getElementById('editMetodoPago').value = alumnoEditando.metodoPago || 'CLASE';
        document.getElementById('editEstado').value = alumnoEditando.estado || 'activo';
        document.getElementById('editContrasena').value = '';
        
        const modalFoto = document.getElementById('modalFoto');
        if (alumnoEditando.fotoBase64 && alumnoEditando.fotoBase64.startsWith('data:image')) {
            modalFoto.innerHTML = `<img src="${alumnoEditando.fotoBase64}" alt="Foto">`;
        } else {
            modalFoto.innerHTML = `<div class="card-foto-placeholder" style="width:90px;height:90px;font-size:40px;">📷</div>`;
        }
        
        document.getElementById('editModal').classList.add('active');
        toggleBodyScroll(true);
    }

    function cerrarModal() {
        document.getElementById('editModal').classList.remove('active');
        toggleBodyScroll(false);
        alumnoEditando = null;
    }

    async function guardarCambios() {
        if (!alumnoEditando) return;
        
        const nuevaContrasena = document.getElementById('editContrasena').value.trim();
        const updates = {
            nombre: document.getElementById('editNombre').value.trim().toUpperCase(),
            apellidoPaterno: document.getElementById('editApellidoPaterno').value.trim().toUpperCase(),
            apellidoMaterno: document.getElementById('editApellidoMaterno').value.trim().toUpperCase(),
            telefono: document.getElementById('editTelefono').value.trim(),
            email: document.getElementById('editEmail').value.trim().toLowerCase(),
            fechaNacimiento: document.getElementById('editFechaNacimiento').value,
            telefonoEmergencia1: document.getElementById('editEmergencia1').value.trim(),
            telefonoEmergencia2: document.getElementById('editEmergencia2').value.trim(),
            metodoPago: document.getElementById('editMetodoPago').value,
            estado: document.getElementById('editEstado').value
        };
        
        try {
            await db.collection('alumnos').doc(alumnoEditando.id).update(updates);
            
            if (nuevaContrasena && nuevaContrasena.length >= 6) {
                const user = auth.currentUser;
                if (user && user.uid === alumnoEditando.id) {
                    await user.updatePassword(nuevaContrasena);
                } else {
                    alert('⚠️ Solo puedes cambiar tu propia contraseña.');
                }
            }
            
            alert('✅ Alumno actualizado correctamente');
            cerrarModal();
            await cargarAlumnos();
        } catch (error) {
            console.error('Error:', error);
            alert('❌ Error: ' + error.message);
        }
    }

    function preguntarEliminar(uid, nombre) {
        alumnoAEliminar = uid;
        document.getElementById('deleteMessage').innerHTML = `¿Estás seguro de que deseas eliminar a <strong>${nombre}</strong>?`;
        document.getElementById('confirmDeleteModal').classList.add('active');
        toggleBodyScroll(true);
    }

    function cerrarConfirmarModal() {
        document.getElementById('confirmDeleteModal').classList.remove('active');
        toggleBodyScroll(false);
        alumnoAEliminar = null;
    }

    async function confirmarEliminar() {
        if (!alumnoAEliminar) return;
        
        try {
            await db.collection('alumnos').doc(alumnoAEliminar).delete();
            alert('✅ Alumno eliminado correctamente');
            cerrarConfirmarModal();
            await cargarAlumnos();
        } catch (error) {
            console.error('Error al eliminar:', error);
            alert('❌ Error al eliminar: ' + error.message);
            cerrarConfirmarModal();
        }
    }

    // Cerrar modales con tecla ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (document.getElementById('editModal').classList.contains('active')) {
                cerrarModal();
            }
            if (document.getElementById('confirmDeleteModal').classList.contains('active')) {
                cerrarConfirmarModal();
            }
        }
    });

    document.getElementById('searchInput').addEventListener('keyup', filtrarAlumnos);
    
    window.addEventListener('load', function() {
        document.getElementById('searchInput').value = '';
    });
    
    cargarAlumnos();
</script>

</body>
</html>
