<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Firestore</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .error { color: #f00; }
        .success { color: #0f0; }
        button { background: #FFD700; color: #000; padding: 10px 20px; margin: 10px; border: none; cursor: pointer; }
        pre { background: #111; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Test de Firestore</h1>
    <button onclick="testFirestore()">Probar Escritura en Firestore</button>
    <div id="resultado"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
            authDomain: "balam-4e843.firebaseapp.com",
            projectId: "balam-4e843",
            storageBucket: "balam-4e843.firebasestorage.app",
            messagingSenderId: "633718462390",
            appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function testFirestore() {
            const div = document.getElementById('resultado');
            div.innerHTML = '⏳ Escribiendo en Firestore...<br>';
            
            try {
                // Intentar escribir un documento de prueba
                const testId = 'test_' + Date.now();
                await db.collection('prueba_conexion').doc(testId).set({
                    mensaje: 'Hola desde GitHub Pages',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                div.innerHTML += '<span class="success">✅ ¡ÉXITO! Documento escrito correctamente.</span><br>';
                div.innerHTML += '📁 Colección "prueba_conexion" creada automáticamente.<br>';
                
                // Leer lo que acabamos de escribir
                const doc = await db.collection('prueba_conexion').doc(testId).get();
                div.innerHTML += '<pre>' + JSON.stringify(doc.data(), null, 2) + '</pre>';
                
            } catch (error) {
                div.innerHTML += '<span class="error">❌ ERROR: ' + error.message + '</span><br>';
                div.innerHTML += '<span class="error">Código: ' + error.code + '</span><br>';
                
                if (error.code === 'permission-denied') {
                    div.innerHTML += '<br><span class="error">⚠️ SOLUCIÓN: Ve a Firebase Console → Firestore Database → Reglas y cambia a:</span><br>';
                    div.innerHTML += '<pre>rules_version = \'2\';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}</pre>';
                }
            }
        }
    </script>
</body>
</html>
