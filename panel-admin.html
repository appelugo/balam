<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Panel Administrador - Academia BALAM</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
        }

        /* Header más compacto */
        .header {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border-bottom: 2px solid #FFD700;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Logo más grande sin aumentar el header */
        .logo-area img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .logo-area h1 {
            color: #FFD700;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,215,0,0.1);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid #FFD700;
        }

        .user-name {
            color: #FFD700;
            font-weight: bold;
            font-size: 13px;
        }

        .btn-cerrar {
            background: transparent;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 5px 14px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-cerrar:hover {
            background: #FFD700;
            color: #000;
        }

        /* Contenedor principal */
        .container {
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .welcome {
            text-align: center;
            margin-bottom: 35px;
        }

        .welcome h2 {
            color: #FFD700;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #aaa;
            font-size: 13px;
        }

        /* Grid de tarjetas - más compactas */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 35px;
        }

        .card {
            background: linear-gradient(135deg, #1a1a1a 0%, #222 100%);
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #FFD700;
            box-shadow: 0 10px 20px rgba(255,215,0,0.15);
        }

        .card-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .card h3 {
            color: #FFD700;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .card p {
            color: #aaa;
            font-size: 11px;
        }

        /* Área de contenido */
        .content-area {
            background: rgba(26,26,26,0.8);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #FFD700;
            flex-wrap: wrap;
            gap: 15px;
        }

        .content-header h3 {
            color: #FFD700;
            font-size: 20px;
        }

        .close-content {
            background: #333;
            border: none;
            color: #FFD700;
            padding: 6px 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .close-content:hover {
            background: #FFD700;
            color: #000;
        }

        iframe {
            width: 100%;
            min-height: 520px;
            border: none;
            border-radius: 16px;
            background: transparent;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 10px 20px;
            }
            .logo-area img {
                width: 45px;
                height: 45px;
            }
            .logo-area h1 {
                font-size: 18px;
            }
            .container {
                padding: 20px 15px;
            }
            .cards-grid {
                gap: 12px;
            }
            .card {
                padding: 14px 10px;
            }
            .card-icon {
                font-size: 30px;
            }
            .card h3 {
                font-size: 14px;
            }
            .card p {
                font-size: 10px;
            }
            .content-area {
                padding: 15px;
            }
            iframe {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-area">
        <!-- Logo más grande - ajusta la ruta si es necesario -->
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <h1>ACADEMIA BALAM</h1>
    </div>
    <div class="user-info">
        <span class="user-name" id="userName">Cargando...</span>
        <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
</div>

<div class="container">
    <div class="welcome">
        <h2>✨ Panel de Control ✨</h2>
        <p>Selecciona una opción para comenzar</p>
    </div>

    <div class="cards-grid">
        <div class="card" onclick="cargarSeccion('registro-alumnos.html', '📝 Registrar Alumno')">
            <div class="card-icon">👨‍🎓</div>
            <h3>Registrar Alumno</h3>
            <p>Nuevo estudiante</p>
        </div>

        <div class="card" onclick="cargarSeccion('registro-auxiliar.html', '👥 Registrar Auxiliar')">
            <div class="card-icon">👥</div>
            <h3>Registrar Auxiliar</h3>
            <p>Personal de apoyo</p>
        </div>

        <div class="card" onclick="cargarSeccion('horarios.html', '📅 Horarios')">
            <div class="card-icon">📅</div>
            <h3>Horarios</h3>
            <p>Gestionar horarios</p>
        </div>

        <div class="card" onclick="cargarSeccion('escanear-qr.html', '📷 Escanear QR')">
            <div class="card-icon">📱</div>
            <h3>Escanear QR</h3>
            <p>Tomar asistencia</p>
        </div>

        <div class="card" onclick="cargarSeccion('reportes.html', '📊 Reportes')">
            <div class="card-icon">📈</div>
            <h3>Reportes</h3>
            <p>Ver estadísticas</p>
        </div>
    </div>

    <div id="contenidoDinamico" class="content-area" style="display: none;">
        <div class="content-header">
            <h3 id="tituloSeccion">Sección</h3>
            <button class="close-content" onclick="cerrarSeccion()">✖️ Cerrar</button>
        </div>
        <iframe id="contenidoFrame" src=""></iframe>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        try {
            const adminDoc = await db.collection('administradores').doc(user.uid).get();
            if (adminDoc.exists) {
                const nombre = adminDoc.data().Nombre || adminDoc.data().nombre || 'Administrador';
                document.getElementById('userName').textContent = nombre;
            } else {
                document.getElementById('userName').textContent = user.email;
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('userName').textContent = user.email;
        }
    });

    function cargarSeccion(url, titulo) {
        const contenidoDiv = document.getElementById('contenidoDinamico');
        const iframe = document.getElementById('contenidoFrame');
        const tituloElem = document.getElementById('tituloSeccion');
        
        tituloElem.textContent = titulo;
        iframe.src = url;
        contenidoDiv.style.display = 'block';
        // ELIMINADO EL scrollIntoView - ya no se desplaza automáticamente
    }

    function cerrarSeccion() {
        const contenidoDiv = document.getElementById('contenidoDinamico');
        const iframe = document.getElementById('contenidoFrame');
        
        contenidoDiv.style.display = 'none';
        iframe.src = '';
    }

    function cerrarSesion() {
        auth.signOut().then(() => {
            window.location.href = 'login.html';
        });
    }
</script>

</body>
</html>
