<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gestión de Alumnos - Academia BALAM</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #FFD700;
        }
        .header h1 {
            color: #FFD700;
            font-size: 24px;
        }
        .btn-cerrar {
            background: #2a2a2a;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
        }
        .buscador {
            margin-bottom: 25px;
        }
        .buscador input {
            width: 100%;
            padding: 12px 18px;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 30px;
            color: white;
            font-size: 14px;
        }
        .buscador input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stats span {
            background: #1a1a1a;
            padding: 6px 15px;
            border-radius: 20px;
            color: #FFD700;
            font-size: 13px;
        }
        .tabla-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #333;
            color: #ddd;
            font-size: 13px;
            vertical-align: middle;
        }
        th {
            background: #0a0a0a;
            color: #FFD700;
            font-weight: 600;
        }
        tr:hover {
            background: #252525;
        }
        .foto-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #0a0a0a;
            border: 1px solid #FFD700;
        }
        .sin-foto {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #666;
        }
        .estado-activo {
            background: rgba(0,255,0,0.2);
            color: #0f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .estado-inactivo {
            background: rgba(255,0,0,0.2);
            color: #f66;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .btn-editar {
            background: #FFD700;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-editar:hover {
            transform: scale(1.05);
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 28px;
            border: 1px solid #FFD700;
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
        }
        .modal-content h2 {
            color: #FFD700;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #FFD700;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            color: white;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .foto-modal {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .foto-modal img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #FFD700;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-guardar {
            background: #FFD700;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        .btn-cancelar {
            background: #333;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        .cargando {
            text-align: center;
            color: #FFD700;
            padding: 40px;
        }
        @media (max-width: 800px) {
            th, td { padding: 8px 6px; font-size: 11px; }
            .btn-editar { padding: 4px 8px; font-size: 10px; }
            .foto-thumb { width: 30px; height: 30px; }
            .sin-foto { width: 30px; height: 30px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>👨‍🎓 GESTIÓN DE ALUMNOS</h1>
        <button class="btn-cerrar" onclick="window.close()">✖️ Cerrar</button>
    </div>

    <div class="buscador">
        <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre, email o teléfono..." autocomplete="off">
    </div>

    <div class="stats">
        <span id="totalCount">Total: 0</span>
        <span id="activosCount">Activos: 0</span>
        <span id="inactivosCount">Inactivos: 0</span>
    </div>

    <div class="tabla-container" id="tablaContainer">
        <div class="cargando">⏳ Cargando alumnos...</div>
    </div>
</div>

<!-- MODAL DE EDICIÓN -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h2>✏️ EDITAR ALUMNO</h2>
        <input type="hidden" id="editUid">
        
        <div class="foto-modal" id="modalFoto"></div>
        
        <div class="form-group">
            <label>NOMBRE(S)</label>
            <input type="text" id="editNombre" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
            <label>APELLIDO PATERNO</label>
            <input type="text" id="editApellidoPaterno" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
            <label>APELLIDO MATERNO</label>
            <input type="text" id="editApellidoMaterno" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
            <label>TELÉFONO</label>
            <input type="tel" id="editTelefono">
        </div>
        <div class="form-group">
            <label>EMAIL</label>
            <input type="email" id="editEmail">
        </div>
        <div class="form-group">
            <label>FECHA DE NACIMIENTO</label>
            <input type="date" id="editFechaNacimiento">
        </div>
        <div class="form-group">
            <label>TELÉFONO EMERGENCIA 1</label>
            <input type="tel" id="editEmergencia1">
        </div>
        <div class="form-group">
            <label>TELÉFONO EMERGENCIA 2 (opcional)</label>
            <input type="tel" id="editEmergencia2">
        </div>
        <div class="form-group">
            <label>MÉTODO DE PAGO</label>
            <select id="editMetodoPago">
                <option value="CLASE">CLASE</option>
                <option value="PAGO">PAGO</option>
            </select>
        </div>
        <div class="form-group">
            <label>ESTADO</label>
            <select id="editEstado">
                <option value="activo">ACTIVO</option>
                <option value="inactivo">INACTIVO</option>
            </select>
        </div>
        <div class="form-group">
            <label>🔑 NUEVA CONTRASEÑA (dejar vacío para no cambiar)</label>
            <input type="password" id="editContrasena" placeholder="Mínimo 6 caracteres" autocomplete="off">
        </div>
        <div class="modal-buttons">
            <button class="btn-guardar" onclick="guardarCambios()">💾 GUARDAR</button>
            <button class="btn-cancelar" onclick="cerrarModal()">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let allAlumnos = [];
    let filteredAlumnos = [];

    async function cargarAlumnos() {
        const container = document.getElementById('tablaContainer');
        container.innerHTML = '<div class="cargando">⏳ Cargando alumnos...</div>';
        
        try {
            const snapshot = await db.collection('alumnos').get();
            allAlumnos = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                allAlumnos.push({
                    id: doc.id,
                    ...data
                });
            });
            filteredAlumnos = [...allAlumnos];
            actualizarStats();
            renderizarTabla();
        } catch (error) {
            console.error('Error al cargar:', error);
            container.innerHTML = '<div class="cargando" style="color:#f66;">❌ Error al cargar alumnos</div>';
        }
    }

    function actualizarStats() {
        const total = allAlumnos.length;
        const activos = allAlumnos.filter(a => a.estado === 'activo').length;
        const inactivos = total - activos;
        document.getElementById('totalCount').innerHTML = `📊 Total: ${total}`;
        document.getElementById('activosCount').innerHTML = `✅ Activos: ${activos}`;
        document.getElementById('inactivosCount').innerHTML = `❌ Inactivos: ${inactivos}`;
    }

    function filtrarAlumnos() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!searchTerm) {
            filteredAlumnos = [...allAlumnos];
        } else {
            filteredAlumnos = allAlumnos.filter(alumno => 
                (alumno.nombre || '').toLowerCase().includes(searchTerm) ||
                (alumno.email || '').toLowerCase().includes(searchTerm) ||
                (alumno.telefono || '').includes(searchTerm)
            );
        }
        renderizarTabla();
    }

    function getFotoThumb(alumno) {
        if (alumno.fotoBase64 && alumno.fotoBase64.startsWith('data:image')) {
            return `<img src="${alumno.fotoBase64}" class="foto-thumb" alt="foto">`;
        } else {
            return `<div class="sin-foto">📷</div>`;
        }
    }

    function renderizarTabla() {
        const container = document.getElementById('tablaContainer');
        if (filteredAlumnos.length === 0) {
            container.innerHTML = '<div class="cargando">📭 No se encontraron alumnos</div>';
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>FOTO</th>
                        <th>NOMBRE</th>
                        <th>EMAIL</th>
                        <th>TELÉFONO</th>
                        <th>EMERGENCIA</th>
                        <th>MÉTODO PAGO</th>
                        <th>ESTADO</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        filteredAlumnos.forEach(alumno => {
            const nombreCompleto = `${alumno.nombre || ''} ${alumno.apellidoPaterno || ''} ${alumno.apellidoMaterno || ''}`.trim();
            const estadoClass = alumno.estado === 'activo' ? 'estado-activo' : 'estado-inactivo';
            const estadoText = alumno.estado === 'activo' ? 'ACTIVO' : 'INACTIVO';
            const fotoThumb = getFotoThumb(alumno);
            
            html += `
                <tr>
                    <td>${fotoThumb}</td>
                    <td><strong>${nombreCompleto}</strong><br><span style="font-size:10px;color:#888;">${alumno.usuario || ''}</span></td>
                    <td>${alumno.email || ''}</td>
                    <td>${alumno.telefono || ''}</td>
                    <td>${alumno.telefonoEmergencia1 || ''}</td>
                    <td>${alumno.metodoPago || 'CLASE'}</td>
                    <td><span class="${estadoClass}">${estadoText}</span></td>
                    <td><button class="btn-editar" onclick="abrirModal('${alumno.id}')">✏️ EDITAR</button></td>
                </tr>
            `;
        });
        
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    let alumnoEditando = null;

    async function abrirModal(uid) {
        const doc = await db.collection('alumnos').doc(uid).get();
        if (!doc.exists) return;
        
        alumnoEditando = { id: doc.id, ...doc.data() };
        
        document.getElementById('editUid').value = alumnoEditando.id;
        document.getElementById('editNombre').value = alumnoEditando.nombre || '';
        document.getElementById('editApellidoPaterno').value = alumnoEditando.apellidoPaterno || '';
        document.getElementById('editApellidoMaterno').value = alumnoEditando.apellidoMaterno || '';
        document.getElementById('editTelefono').value = alumnoEditando.telefono || '';
        document.getElementById('editEmail').value = alumnoEditando.email || '';
        document.getElementById('editFechaNacimiento').value = alumnoEditando.fechaNacimiento || '';
        document.getElementById('editEmergencia1').value = alumnoEditando.telefonoEmergencia1 || '';
        document.getElementById('editEmergencia2').value = alumnoEditando.telefonoEmergencia2 || '';
        document.getElementById('editMetodoPago').value = alumnoEditando.metodoPago || 'CLASE';
        document.getElementById('editEstado').value = alumnoEditando.estado || 'activo';
        document.getElementById('editContrasena').value = '';
        
        // Mostrar foto en modal
        const modalFoto = document.getElementById('modalFoto');
        if (alumnoEditando.fotoBase64 && alumnoEditando.fotoBase64.startsWith('data:image')) {
            modalFoto.innerHTML = `<img src="${alumnoEditando.fotoBase64}" alt="Foto">`;
        } else {
            modalFoto.innerHTML = `<div class="sin-foto" style="width:80px;height:80px;font-size:40px;">📷</div>`;
        }
        
        document.getElementById('editModal').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('editModal').style.display = 'none';
        alumnoEditando = null;
    }

    async function guardarCambios() {
        if (!alumnoEditando) return;
        
        const nuevaContrasena = document.getElementById('editContrasena').value.trim();
        const updates = {
            nombre: document.getElementById('editNombre').value.trim().toUpperCase(),
            apellidoPaterno: document.getElementById('editApellidoPaterno').value.trim().toUpperCase(),
            apellidoMaterno: document.getElementById('editApellidoMaterno').value.trim().toUpperCase(),
            telefono: document.getElementById('editTelefono').value.trim(),
            email: document.getElementById('editEmail').value.trim().toLowerCase(),
            fechaNacimiento: document.getElementById('editFechaNacimiento').value,
            telefonoEmergencia1: document.getElementById('editEmergencia1').value.trim(),
            telefonoEmergencia2: document.getElementById('editEmergencia2').value.trim(),
            metodoPago: document.getElementById('editMetodoPago').value,
            estado: document.getElementById('editEstado').value
        };
        
        try {
            // Actualizar Firestore
            await db.collection('alumnos').doc(alumnoEditando.id).update(updates);
            
            // Actualizar contraseña si se proporcionó
            if (nuevaContrasena && nuevaContrasena.length >= 6) {
                const user = auth.currentUser;
                if (user && user.uid === alumnoEditando.id) {
                    await user.updatePassword(nuevaContrasena);
                } else {
                    alert('⚠️ Solo puedes cambiar tu propia contraseña. Inicia sesión como administrador para cambiar la de otros.');
                }
            }
            
            alert('✅ Alumno actualizado correctamente');
            cerrarModal();
            await cargarAlumnos();
        } catch (error) {
            console.error('Error:', error);
            alert('❌ Error: ' + error.message);
        }
    }

    // Evento de búsqueda
    document.getElementById('searchInput').addEventListener('keyup', filtrarAlumnos);
    
    cargarAlumnos();
</script>

</body>
</html>
