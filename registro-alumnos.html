<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Registrar Alumno - Academia BALAM</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        /* Pantalla de éxito */
        .success-screen {
            background: #1a1a1a;
            border-radius: 28px;
            border: 2px solid #00ff00;
            padding: 40px 25px;
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        .success-screen .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .success-screen h2 {
            color: #00ff00;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .success-screen .info-box {
            background: #0a0a0a;
            border-radius: 16px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }

        .success-screen .info-box p {
            color: #FFD700;
            margin: 8px 0;
            font-size: 14px;
            word-break: break-all;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
        }

        /* Formulario */
        .card {
            background: #1a1a1a;
            border-radius: 28px;
            border: 1px solid #FFD700;
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
        }

        .foto-section {
            background: linear-gradient(135deg, #0f0f0f 0%, #151515 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .foto-title {
            color: #FFD700;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .foto-preview {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            background: #0a0a0a;
            border-radius: 50%;
            border: 3px solid #FFD700;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .foto-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foto-placeholder {
            font-size: 55px;
            color: #555;
        }

        .btn-foto-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-foto {
            background: #2a2a2a;
            border: 1px solid #FFD700;
            padding: 8px 18px;
            border-radius: 30px;
            color: #FFD700;
            font-size: 13px;
            cursor: pointer;
        }

        .form-section {
            padding: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #FFD700;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        label .required {
            color: #ff6666;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #FFD700;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .separator {
            height: 1px;
            background: #333;
            margin: 20px 0 15px 0;
        }

        .separator span {
            display: block;
            text-align: center;
            color: #FFD700;
            font-size: 11px;
            background: #1a1a1a;
            width: fit-content;
            margin: -8px auto 0;
            padding: 0 12px;
        }

        .usuario-card {
            background: linear-gradient(135deg, #1a2a1a 0%, #0f1a0f 100%);
            border: 1px solid #FFD700;
            border-radius: 16px;
            padding: 12px;
            margin: 15px 0;
            text-align: center;
        }

        .usuario-value {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
            font-family: monospace;
        }

        .btn-registrar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            margin-top: 10px;
        }

        .mensaje {
            padding: 12px;
            border-radius: 14px;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff4444;
            color: #ff8888;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .row { grid-template-columns: 1fr; gap: 0; }
            .foto-preview { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Pantalla de registro (visible por defecto) -->
    <div id="formularioContainer">
        <div class="card">
            <div class="foto-section">
                <div class="foto-title">📸 FOTO DEL ALUMNO</div>
                <div class="foto-preview" id="fotoPreview" onclick="subirFoto()">
                    <div class="foto-placeholder" id="fotoPlaceholder">📷</div>
                </div>
                <div class="btn-foto-group">
                    <button type="button" class="btn-foto" onclick="tomarFoto()">📸 Tomar foto</button>
                    <button type="button" class="btn-foto" onclick="subirFoto()">🖼️ Subir imagen</button>
                </div>
            </div>

            <div class="form-section">
                <div class="row">
                    <div class="form-group">
                        <label>NOMBRE(S) <span class="required">*</span></label>
                        <input type="text" id="nombre" placeholder="Juan Carlos">
                    </div>
                    <div class="form-group">
                        <label>APELLIDO PATERNO <span class="required">*</span></label>
                        <input type="text" id="apellidoPaterno" placeholder="García">
                    </div>
                </div>

                <div class="form-group">
                    <label>APELLIDO MATERNO <span class="required">*</span></label>
                    <input type="text" id="apellidoMaterno" placeholder="López">
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>TELÉFONO <span class="required">*</span></label>
                        <input type="tel" id="telefono" placeholder="55 1234 5678">
                    </div>
                    <div class="form-group">
                        <label>EMAIL <span class="required">*</span></label>
                        <input type="email" id="email" placeholder="alumno@ejemplo.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>FECHA DE NACIMIENTO <span class="required">*</span></label>
                    <input type="date" id="fechaNacimiento">
                </div>

                <div class="separator"><span>📞 CONTACTOS DE EMERGENCIA</span></div>

                <div class="form-group">
                    <label>TELÉFONO EMERGENCIA 1 <span class="required">*</span></label>
                    <input type="tel" id="emergencia1" placeholder="55 9876 5432">
                </div>

                <div class="form-group">
                    <label>TELÉFONO EMERGENCIA 2 <span class="opcional">(Opcional)</span></label>
                    <input type="tel" id="emergencia2" placeholder="55 8765 4321">
                </div>

                <div class="separator"><span>🥋 DATOS ACADÉMICOS</span></div>

                <div class="form-group">
                    <label>DISCIPLINA <span class="required">*</span></label>
                    <select id="disciplina">
                        <option value="">Seleccionar disciplina</option>
                        <option value="ENTRENAMIENTO FUNCIONAL">🏋️ ENTRENAMIENTO FUNCIONAL</option>
                        <option value="ZUMBA">💃 ZUMBA</option>
                        <option value="PILATES">🧘 PILATES</option>
                        <option value="TAEWONDO">🥋 TAEWONDO</option>
                        <option value="BOX">🥊 BOX</option>
                        <option value="KICK BOXING">🦵 KICK BOXING</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>CONTRASEÑA <span class="required">*</span></label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                </div>

                <div id="usuarioPreview" class="usuario-card" style="display: none;">
                    <div class="usuario-label">👤 USUARIO GENERADO</div>
                    <div class="usuario-value" id="usuarioGenerado"></div>
                    <div style="font-size: 10px; color: #888; margin-top: 5px;">Este será su usuario para iniciar sesión</div>
                </div>

                <button class="btn-registrar" onclick="registrarAlumno()">
                    ✅ REGISTRAR ALUMNO
                </button>

                <div id="mensaje" class="mensaje"></div>
            </div>
        </div>
    </div>

    <!-- Pantalla de éxito (oculta por defecto) -->
    <div id="exitoContainer" style="display: none;">
        <div class="success-screen">
            <div class="icon">✅</div>
            <h2>¡ALUMNO REGISTRADO!</h2>
            <div class="info-box" id="exitoInfo">
                <!-- Aquí se llenarán los datos del alumno registrado -->
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="registrarOtro()">📝 REGISTRAR OTRO</button>
                <button class="btn-secondary" onclick="irPanelPrincipal()">🏠 IR AL PANEL PRINCIPAL</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let fotoFile = null;
    let fotoDataURL = null;
    let ultimoRegistro = null;

    function generarUsuario() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const ap = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        
        if (nombre && ap) {
            const usuario = nombre.charAt(0) + ap;
            document.getElementById('usuarioGenerado').textContent = usuario;
            document.getElementById('usuarioPreview').style.display = 'block';
            return usuario;
        } else {
            document.getElementById('usuarioPreview').style.display = 'none';
            return null;
        }
    }

    document.getElementById('nombre').addEventListener('input', generarUsuario);
    document.getElementById('apellidoPaterno').addEventListener('input', generarUsuario);

    function tomarFoto() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = (e) => procesarFoto(e.target.files[0]);
        input.click();
    }

    function subirFoto() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => procesarFoto(e.target.files[0]);
        input.click();
    }

    function procesarFoto(file) {
        if (!file) return;
        
        fotoFile = file;
        const reader = new FileReader();
        reader.onload = (event) => {
            fotoDataURL = event.target.result;
            const preview = document.getElementById('fotoPreview');
            preview.innerHTML = `<img src="${fotoDataURL}" alt="Foto perfil">`;
        };
        reader.readAsDataURL(file);
    }

    function mostrarExito(email, usuario, password) {
        const exitoInfo = document.getElementById('exitoInfo');
        exitoInfo.innerHTML = `
            <p>📧 <strong>Email:</strong> ${email}</p>
            <p>👤 <strong>Usuario:</strong> ${usuario}</p>
            <p>🔑 <strong>Contraseña:</strong> ${password}</p>
            <p>📁 <strong>Guardado en:</strong> Authentication + Firestore</p>
            <p>📂 <strong>Colección:</strong> alumnos</p>
        `;
        document.getElementById('formularioContainer').style.display = 'none';
        document.getElementById('exitoContainer').style.display = 'block';
    }

    function registrarOtro() {
        // Limpiar formulario
        document.getElementById('nombre').value = '';
        document.getElementById('apellidoPaterno').value = '';
        document.getElementById('apellidoMaterno').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('email').value = '';
        document.getElementById('fechaNacimiento').value = '';
        document.getElementById('emergencia1').value = '';
        document.getElementById('emergencia2').value = '';
        document.getElementById('disciplina').value = '';
        document.getElementById('password').value = '';
        document.getElementById('fotoPreview').innerHTML = '<div class="foto-placeholder" id="fotoPlaceholder">📷</div>';
        document.getElementById('usuarioPreview').style.display = 'none';
        fotoFile = null;
        fotoDataURL = null;
        
        document.getElementById('exitoContainer').style.display = 'none';
        document.getElementById('formularioContainer').style.display = 'block';
    }

    function irPanelPrincipal() {
        window.location.href = 'panel-admin.html';
    }

    async function registrarAlumno() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const apPaterno = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        const apMaterno = document.getElementById('apellidoMaterno').value.trim().toUpperCase();
        const telefono = document.getElementById('telefono').value.trim();
        const email = document.getElementById('email').value.trim();
        const fechaNacimiento = document.getElementById('fechaNacimiento').value;
        const emergencia1 = document.getElementById('emergencia1').value.trim();
        const emergencia2 = document.getElementById('emergencia2').value.trim();
        const disciplina = document.getElementById('disciplina').value;
        const password = document.getElementById('password').value;
        const usuario = generarUsuario();

        if (!nombre || !apPaterno || !apMaterno || !telefono || !email || !fechaNacimiento || !emergencia1 || !disciplina || !password) {
            mostrarMensaje('❌ Completa todos los campos obligatorios (*)', 'error');
            return;
        }

        if (password.length < 6) {
            mostrarMensaje('❌ La contraseña debe tener al menos 6 caracteres', 'error');
            return;
        }

        mostrarMensaje('⏳ Registrando alumno...', null);

        try {
            // Crear en Authentication
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const uid = userCredential.user.uid;

            // Subir foto
            let fotoURL = '';
            if (fotoFile) {
                const storageRef = storage.ref().child(`fotos_alumnos/${uid}.jpg`);
                await storageRef.put(fotoFile);
                fotoURL = await storageRef.getDownloadURL();
            }

            // Guardar en Firestore (¡ESTE ES EL PASO CLAVE!)
            const alumnoData = {
                uid: uid,
                usuario: usuario,
                nombre: nombre,
                apellidoPaterno: apPaterno,
                apellidoMaterno: apMaterno,
                telefono: telefono,
                email: email,
                fechaNacimiento: fechaNacimiento,
                telefonoEmergencia1: emergencia1,
                telefonoEmergencia2: emergencia2 || '',
                disciplina: disciplina,
                rol: 'estudiante',
                activo: true,
                fotoURL: fotoURL,
                fechaRegistro: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection('alumnos').doc(uid).set(alumnoData);
            
            console.log('✅ Documento creado en Firestore. Colección "alumnos" creada automáticamente');
            
            // Mostrar pantalla de éxito
            mostrarExito(email, usuario, password);

        } catch (error) {
            console.error('Error:', error);
            let mensaje = '';
            if (error.code === 'auth/email-already-in-use') {
                mensaje = '❌ Este email ya está registrado';
            } else if (error.code === 'permission-denied') {
                mensaje = '❌ Error de permisos. Ve a Firestore → Reglas y cambia a "modo prueba"';
            } else {
                mensaje = '❌ Error: ' + error.message;
            }
            mostrarMensaje(mensaje, 'error');
        }
    }

    function mostrarMensaje(msg, tipo) {
        const div = document.getElementById('mensaje');
        div.innerHTML = msg;
        div.className = 'mensaje ' + (tipo || '');
        div.style.display = 'block';
        setTimeout(() => {
            div.style.display = 'none';
        }, 4000);
    }
</script>

</body>
</html>
