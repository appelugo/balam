<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Registrar Alumno - Academia BALAM</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 550px; margin: 0 auto; }
        .card {
            background: #1a1a1a;
            border-radius: 28px;
            border: 1px solid #FFD700;
            overflow: hidden;
        }
        .foto-section {
            background: linear-gradient(135deg, #0f0f0f 0%, #151515 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .foto-title { color: #FFD700; font-size: 14px; margin-bottom: 15px; }
        .foto-preview {
            width: 130px; height: 130px; margin: 0 auto 15px;
            background: #0a0a0a; border-radius: 50%; border: 3px solid #FFD700;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .foto-preview img { width: 100%; height: 100%; object-fit: cover; }
        .foto-placeholder { font-size: 55px; color: #555; }
        .btn-foto-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-foto {
            background: #2a2a2a; border: 1px solid #FFD700; padding: 8px 18px;
            border-radius: 30px; color: #FFD700; font-size: 13px; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-foto:hover { background: #FFD700; color: #000; }
        .form-section { padding: 22px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; color: #FFD700; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
        label .required { color: #ff6666; }
        input, select {
            width: 100%; padding: 12px 14px; background: #252525;
            border: 1px solid #3a3a3a; border-radius: 14px; color: #fff; font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: #FFD700; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .separator { height: 1px; background: #333; margin: 20px 0 15px 0; }
        .separator span {
            display: block; text-align: center; color: #FFD700; font-size: 11px;
            background: #1a1a1a; width: fit-content; margin: -8px auto 0; padding: 0 12px;
        }
        .usuario-card {
            background: linear-gradient(135deg, #1a2a1a 0%, #0f1a0f 100%);
            border: 1px solid #FFD700; border-radius: 16px; padding: 12px;
            margin: 15px 0; text-align: center;
        }
        .usuario-value { font-size: 20px; font-weight: bold; color: #FFD700; font-family: monospace; }
        .btn-registrar {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none; border-radius: 16px; font-size: 16px; font-weight: bold;
            color: #000; cursor: pointer; margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-registrar:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,215,0,0.4); }
        
        /* LOADER CON ESTELA DE LUZ (la imagen NO gira) */
        .loader-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 25px;
        }
        .loader-logo {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }
        /* Círculo con estela de luz (gira SOLO el círculo) */
        .light-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: transparent;
            z-index: 1;
        }
        .light-ring::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #FFD700, #FFA500, transparent);
            animation: rotateLight 1.5s linear infinite;
            z-index: 1;
        }
        .light-ring::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: #0a0a0a;
            border-radius: 50%;
            z-index: 2;
        }
        @keyframes rotateLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            color: #FFD700;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* MODAL DE ÉXITO */
        .modal-exito {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 28px;
            border: 2px solid #00ff00;
            max-width: 400px;
            width: 90%;
            padding: 35px 25px;
            text-align: center;
            animation: fadeInUp 0.3s ease;
        }
        .modal-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }
        .modal-content h2 {
            color: #00ff00;
            font-size: 26px;
            margin-bottom: 20px;
        }
        .info-box {
            background: #0a0a0a;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .info-box p {
            color: #FFD700;
            margin: 12px 0;
            font-size: 14px;
            word-break: break-all;
        }
        .info-box .password {
            background: #252525;
            padding: 8px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
            letter-spacing: 2px;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn-modal-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-modal-secondary {
            background: #2a2a2a;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 500px) {
            .row { grid-template-columns: 1fr; gap: 0; }
            .foto-preview { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="foto-section">
            <div class="foto-title">📸 FOTO DEL ALUMNO</div>
            <div class="foto-preview" id="fotoPreview" onclick="subirFoto()">
                <div class="foto-placeholder" id="fotoPlaceholder">📷</div>
            </div>
            <div class="btn-foto-group">
                <button type="button" class="btn-foto" onclick="tomarFoto()">📸 Tomar foto</button>
                <button type="button" class="btn-foto" onclick="subirFoto()">🖼️ Subir imagen</button>
            </div>
        </div>

        <div class="form-section">
            <div class="row">
                <div class="form-group"><label>NOMBRE(S) <span class="required">*</span></label><input type="text" id="nombre" placeholder="Juan Carlos"></div>
                <div class="form-group"><label>APELLIDO PATERNO <span class="required">*</span></label><input type="text" id="apellidoPaterno" placeholder="García"></div>
            </div>
            <div class="form-group"><label>APELLIDO MATERNO <span class="required">*</span></label><input type="text" id="apellidoMaterno" placeholder="López"></div>
            <div class="row">
                <div class="form-group"><label>TELÉFONO <span class="required">*</span></label><input type="tel" id="telefono" placeholder="55 1234 5678"></div>
                <div class="form-group"><label>EMAIL <span class="required">*</span></label><input type="email" id="email" placeholder="alumno@ejemplo.com"></div>
            </div>
            <div class="form-group"><label>FECHA DE NACIMIENTO <span class="required">*</span></label><input type="date" id="fechaNacimiento"></div>
            <div class="separator"><span>📞 CONTACTOS DE EMERGENCIA</span></div>
            <div class="form-group"><label>TELÉFONO EMERGENCIA 1 <span class="required">*</span></label><input type="tel" id="emergencia1" placeholder="55 9876 5432"></div>
            <div class="form-group"><label>TELÉFONO EMERGENCIA 2 <span class="opcional">(Opcional)</span></label><input type="tel" id="emergencia2" placeholder="55 8765 4321"></div>
            
            <div class="separator"><span>🥋 DATOS ACADÉMICOS</span></div>
            
            <div id="usuarioPreview" class="usuario-card" style="display: none;">
                <div class="usuario-label">👤 USUARIO GENERADO</div>
                <div class="usuario-value" id="usuarioGenerado"></div>
                <div style="font-size: 10px; color: #888;">Este será su usuario para iniciar sesión</div>
            </div>
            <button class="btn-registrar" id="btnRegistrar" onclick="registrarAlumno()">✅ REGISTRAR ALUMNO</button>
        </div>
    </div>
</div>

<!-- LOADER CON ESTELA DE LUZ -->
<div id="loaderOverlay" class="loader-overlay">
    <div class="loader-logo">
        <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/120?text=Logo'">
        <div class="light-ring"></div>
    </div>
    <div class="loader-text">REGISTRANDO ALUMNO...</div>
</div>

<!-- MODAL DE ÉXITO -->
<div id="modalExito" class="modal-exito">
    <div class="modal-content">
        <div class="modal-icon">✅</div>
        <h2>¡ALUMNO REGISTRADO!</h2>
        <div class="info-box" id="modalInfo"></div>
        <div class="modal-buttons">
            <button class="btn-modal-primary" onclick="registrarOtro()">📝 REGISTRAR OTRO</button>
            <button class="btn-modal-secondary" onclick="irPanelPrincipal()">🏠 IR AL PANEL</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let fotoFile = null;
    let fotoDataURL = null;
    let ultimoUid = null;
    let ultimaContrasena = null;

    // Generar contraseña fácil de recordar
    function generarContrasena(nombre, apellido) {
        const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
        const mes = meses[new Date().getMonth()];
        const anio = new Date().getFullYear();
        const nombreCorto = nombre.substring(0, 3);
        const apCorto = apellido.substring(0, 3);
        return `${nombreCorto}${apCorto}${mes}${anio}`.toUpperCase();
    }

    function generarUsuario() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const ap = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        if (nombre && ap) {
            const usuario = nombre.charAt(0) + ap;
            document.getElementById('usuarioGenerado').textContent = usuario;
            document.getElementById('usuarioPreview').style.display = 'block';
            return usuario;
        } else {
            document.getElementById('usuarioPreview').style.display = 'none';
            return null;
        }
    }

    document.getElementById('nombre').addEventListener('input', generarUsuario);
    document.getElementById('apellidoPaterno').addEventListener('input', generarUsuario);

    function tomarFoto() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = (e) => procesarFoto(e.target.files[0]);
        input.click();
    }

    function subirFoto() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => procesarFoto(e.target.files[0]);
        input.click();
    }

    function procesarFoto(file) {
        if (!file) return;
        fotoFile = file;
        const reader = new FileReader();
        reader.onload = (event) => {
            fotoDataURL = event.target.result;
            document.getElementById('fotoPreview').innerHTML = `<img src="${fotoDataURL}" alt="Foto">`;
        };
        reader.readAsDataURL(file);
    }

    function mostrarLoader(mostrar) {
        document.getElementById('loaderOverlay').style.display = mostrar ? 'flex' : 'none';
    }

    function mostrarModal(email, usuario, contrasena) {
        const modalInfo = document.getElementById('modalInfo');
        modalInfo.innerHTML = `
            <p>📧 <strong>Email:</strong> ${email}</p>
            <p>👤 <strong>Usuario:</strong> ${usuario}</p>
            <p>🔑 <strong>Contraseña:</strong></p>
            <div class="password">${contrasena}</div>
            <p style="font-size: 12px; color: #888; margin-top: 10px;">📁 Guardado en Authentication + Firestore</p>
        `;
        document.getElementById('modalExito').style.display = 'flex';
    }

    function registrarOtro() {
        document.getElementById('modalExito').style.display = 'none';
        document.getElementById('nombre').value = '';
        document.getElementById('apellidoPaterno').value = '';
        document.getElementById('apellidoMaterno').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('email').value = '';
        document.getElementById('fechaNacimiento').value = '';
        document.getElementById('emergencia1').value = '';
        document.getElementById('emergencia2').value = '';
        document.getElementById('password') && (document.getElementById('password').value = '');
        document.getElementById('fotoPreview').innerHTML = '<div class="foto-placeholder" id="fotoPlaceholder">📷</div>';
        document.getElementById('usuarioPreview').style.display = 'none';
        fotoFile = null;
        fotoDataURL = null;
        document.getElementById('btnRegistrar').disabled = false;
        document.getElementById('btnRegistrar').textContent = '✅ REGISTRAR ALUMNO';
    }

    function irPanelPrincipal() {
        window.location.href = 'panel-admin.html';
    }

    async function registrarAlumno() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const apPaterno = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        const apMaterno = document.getElementById('apellidoMaterno').value.trim().toUpperCase();
        const telefono = document.getElementById('telefono').value.trim();
        const email = document.getElementById('email').value.trim();
        const fechaNacimiento = document.getElementById('fechaNacimiento').value;
        const emergencia1 = document.getElementById('emergencia1').value.trim();
        const emergencia2 = document.getElementById('emergencia2').value.trim();
        const usuario = generarUsuario();
        const contrasena = generarContrasena(nombre, apPaterno);

        if (!nombre || !apPaterno || !apMaterno || !telefono || !email || !fechaNacimiento || !emergencia1) {
            alert('❌ Completa todos los campos obligatorios');
            return;
        }

        mostrarLoader(true);
        document.getElementById('btnRegistrar').disabled = true;
        document.getElementById('btnRegistrar').textContent = '⏳ REGISTRANDO...';

        try {
            // 1. Crear en Authentication
            const userCredential = await auth.createUserWithEmailAndPassword(email, contrasena);
            const uid = userCredential.user.uid;
            console.log('✅ Usuario creado en Auth:', uid);

            // 2. Subir foto
            let fotoURL = '';
            if (fotoFile) {
                const storageRef = storage.ref().child(`fotos_alumnos/${uid}.jpg`);
                await storageRef.put(fotoFile);
                fotoURL = await storageRef.getDownloadURL();
                console.log('✅ Foto subida');
            }

            // 3. Guardar en Firestore
            const alumnoData = {
                uid: uid,
                usuario: usuario,
                nombre: nombre,
                apellidoPaterno: apPaterno,
                apellidoMaterno: apMaterno,
                telefono: telefono,
                email: email,
                fechaNacimiento: fechaNacimiento,
                telefonoEmergencia1: emergencia1,
                telefonoEmergencia2: emergencia2 || '',
                rol: 'estudiante',
                activo: true,
                fotoURL: fotoURL,
                contrasena: contrasena,
                fechaRegistro: firebase.firestore.FieldValue.serverTimestamp()
            };

            await db.collection('alumnos').doc(uid).set(alumnoData);
            console.log('✅ Alumno guardado en Firestore');

            // Ocultar loader y mostrar modal
            mostrarLoader(false);
            mostrarModal(email, usuario, contrasena);

        } catch (error) {
            console.error('❌ ERROR:', error);
            mostrarLoader(false);
            let mensaje = '';
            if (error.code === 'auth/email-already-in-use') {
                mensaje = '❌ Este email ya está registrado';
            } else {
                mensaje = '❌ Error: ' + error.message;
            }
            alert(mensaje);
            document.getElementById('btnRegistrar').disabled = false;
            document.getElementById('btnRegistrar').textContent = '✅ REGISTRAR ALUMNO';
        }
    }
</script>

</body>
</html>
