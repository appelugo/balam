<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Registrar Alumno</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 16px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #FFD700;
        }
        h2 { color: #FFD700; margin-bottom: 20px; text-align: center; font-size: 22px; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; color: #FFD700; margin-bottom: 5px; font-size: 12px; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: #FFD700; }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        /* Área de foto */
        .foto-area {
            background: #111;
            border: 2px dashed #FFD700;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        .foto-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #2a2a2a;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #FFD700;
        }
        .foto-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .foto-preview .sin-foto {
            color: #888;
            font-size: 40px;
        }
        .btn-foto {
            background: #333;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 12px;
            margin: 5px;
        }
        
        .usuario-preview {
            background: rgba(255,215,0,0.1);
            border: 1px solid #FFD700;
            padding: 10px;
            border-radius: 10px;
            margin: 12px 0;
            text-align: center;
            font-size: 13px;
        }
        
        button[type="button"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .mensaje { padding: 10px; border-radius: 10px; margin-top: 15px; text-align: center; font-size: 13px; display: none; }
        .exito { background: rgba(0,255,0,0.2); border: 1px solid #0f0; color: #0f0; }
        .error { background: rgba(255,0,0,0.2); border: 1px solid #f00; color: #f88; }
        
        @media (max-width: 500px) {
            .row { grid-template-columns: 1fr; gap: 0; }
            .form-container { padding: 16px; }
            input, select { padding: 8px 10px; font-size: 13px; }
            .foto-preview { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>📝 REGISTRAR ALUMNO</h2>
    
    <!-- Área de foto -->
    <div class="foto-area">
        <div class="foto-preview" id="fotoPreview">
            <div class="sin-foto">📷</div>
        </div>
        <input type="file" id="fotoInput" accept="image/*" style="display:none;">
        <button type="button" class="btn-foto" onclick="capturarFoto()">📸 Tomar foto</button>
        <button type="button" class="btn-foto" onclick="subirFoto()">🖼️ Subir imagen</button>
    </div>
    
    <div class="row">
        <div class="form-group"><label>NOMBRE(S) *</label><input type="text" id="nombre" placeholder="Ej: Juan Carlos"></div>
        <div class="form-group"><label>APELLIDO PATERNO *</label><input type="text" id="apellidoPaterno" placeholder="Ej: García"></div>
    </div>
    <div class="form-group"><label>APELLIDO MATERNO *</label><input type="text" id="apellidoMaterno" placeholder="Ej: López"></div>
    
    <div class="row">
        <div class="form-group"><label>TELÉFONO *</label><input type="tel" id="telefono" placeholder="55 1234 5678"></div>
        <div class="form-group"><label>EMAIL *</label><input type="email" id="email" placeholder="alumno@ejemplo.com"></div>
    </div>
    
    <div class="form-group"><label>DISCIPLINA *</label>
        <select id="disciplina">
            <option value="">Seleccionar...</option>
            <option value="ENTRENAMIENTO FUNCIONAL">ENTRENAMIENTO FUNCIONAL</option>
            <option value="ZUMBA">ZUMBA</option>
            <option value="PILATES">PILATES</option>
            <option value="TAEWONDO">TAEWONDO</option>
            <option value="BOX">BOX</option>
            <option value="KICK BOXING">KICK BOXING</option>
        </select>
    </div>
    
    <div class="form-group"><label>CONTRASEÑA *</label><input type="password" id="password" placeholder="Mínimo 6 caracteres"></div>
    
    <div id="usuarioPreview" class="usuario-preview" style="display:none;">👤 USUARIO: <strong id="usuarioGenerado"></strong></div>
    
    <button type="button" onclick="registrarAlumno()">✅ REGISTRAR ALUMNO</button>
    <div id="mensaje" class="mensaje"></div>
</div>

<script>
    if (typeof firebase === 'undefined') {
        const firebaseConfig = {
            apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
            authDomain: "balam-4e843.firebaseapp.com",
            projectId: "balam-4e843",
            storageBucket: "balam-4e843.firebasestorage.app",
            messagingSenderId: "633718462390",
            appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
        };
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();
    
    let fotoDataURL = null;
    
    function generarUsuario() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const ap = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        if (nombre && ap) {
            const usuario = nombre.charAt(0) + ap;
            document.getElementById('usuarioGenerado').textContent = usuario;
            document.getElementById('usuarioPreview').style.display = 'block';
            return usuario;
        }
        document.getElementById('usuarioPreview').style.display = 'none';
        return null;
    }
    
    document.getElementById('nombre').addEventListener('input', generarUsuario);
    document.getElementById('apellidoPaterno').addEventListener('input', generarUsuario);
    
    function capturarFoto() {
        const input = document.getElementById('fotoInput');
        input.setAttribute('capture', 'environment');
        input.click();
    }
    
    function subirFoto() {
        const input = document.getElementById('fotoInput');
        input.removeAttribute('capture');
        input.click();
    }
    
    document.getElementById('fotoInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                fotoDataURL = event.target.result;
                const preview = document.getElementById('fotoPreview');
                preview.innerHTML = `<img src="${fotoDataURL}" alt="Foto">`;
            };
            reader.readAsDataURL(file);
        }
    });
    
    async function registrarAlumno() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const apPaterno = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        const apMaterno = document.getElementById('apellidoMaterno').value.trim().toUpperCase();
        const telefono = document.getElementById('telefono').value.trim();
        const email = document.getElementById('email').value.trim();
        const disciplina = document.getElementById('disciplina').value;
        const password = document.getElementById('password').value;
        const usuario = generarUsuario();
        
        if (!nombre || !apPaterno || !apMaterno || !telefono || !email || !disciplina || !password) {
            mostrarMensaje('❌ Completa todos los campos obligatorios', 'error');
            return;
        }
        if (password.length < 6) {
            mostrarMensaje('❌ La contraseña debe tener al menos 6 caracteres', 'error');
            return;
        }
        
        mostrarMensaje('⏳ Registrando alumno...', 'exito');
        
        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const uid = userCredential.user.uid;
            
            let fotoURL = '';
            if (fotoDataURL) {
                const response = await fetch(fotoDataURL);
                const blob = await response.blob();
                const storageRef = storage.ref().child(`fotos_alumnos/${uid}.jpg`);
                await storageRef.put(blob);
                fotoURL = await storageRef.getDownloadURL();
            }
            
            const alumnoData = {
                uid, usuario, nombre, apellidoPaterno: apPaterno, apellidoMaterno: apMaterno,
                telefono, email, disciplina, rol: 'estudiante', activo: true,
                fotoURL: fotoURL,
                fechaRegistro: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('alumnos').doc(uid).set(alumnoData);
            
            mostrarMensaje(`✅ ¡REGISTRADO!<br>📧 ${email}<br>👤 Usuario: ${usuario}<br>🔑 Contraseña: ${password}`, 'exito');
            
            setTimeout(() => {
                document.getElementById('registroForm')?.reset();
                document.getElementById('fotoPreview').innerHTML = '<div class="sin-foto">📷</div>';
                fotoDataURL = null;
            }, 4000);
        } catch (error) {
            let msg = error.code === 'auth/email-already-in-use' ? '❌ Este email ya está registrado' : '❌ Error: ' + error.message;
            mostrarMensaje(msg, 'error');
        }
    }
    
    function mostrarMensaje(msg, tipo) {
        const div = document.getElementById('mensaje');
        div.innerHTML = msg;
        div.className = 'mensaje ' + tipo;
        div.style.display = 'block';
        setTimeout(() => div.style.display = 'none', 5000);
    }
</script>
</body>
</html>
