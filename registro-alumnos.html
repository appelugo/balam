<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Alumno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #FFFFFF;
            padding: 20px;
        }

        .formulario {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333333;
        }

        h2 {
            color: #FFD700;
            margin-bottom: 25px;
            text-align: center;
        }

        .grupo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #FFD700;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .obligatorio {
            color: #FF6666;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background: #2a2a2a;
            border: 1px solid #555555;
            border-radius: 10px;
            color: #FFFFFF;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .fila3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .mensaje {
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .exito {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00FF00;
            color: #00FF00;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #FF4444;
            color: #FF8888;
        }

        .info-generado {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            color: #FFD700;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-family: monospace;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .fila, .fila3 {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .formulario {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="formulario">
    <h2>📋 REGISTRO DE ALUMNO</h2>
    
    <div class="grupo">
        <div class="fila">
            <div>
                <label>Nombre(s) <span class="obligatorio">*</span></label>
                <input type="text" id="nombre" placeholder="Ej: JUAN CARLOS">
            </div>
            <div>
                <label>Apellido Paterno <span class="obligatorio">*</span></label>
                <input type="text" id="apellidoPaterno" placeholder="Ej: GARCIA">
            </div>
        </div>
    </div>

    <div class="grupo">
        <div class="fila">
            <div>
                <label>Apellido Materno <span class="obligatorio">*</span></label>
                <input type="text" id="apellidoMaterno" placeholder="Ej: LOPEZ">
            </div>
            <div>
                <label>Teléfono <span class="obligatorio">*</span></label>
                <input type="tel" id="telefono" placeholder="Ej: 5551234567">
            </div>
        </div>
    </div>

    <div class="grupo">
        <div class="fila">
            <div>
                <label>Email <span class="obligatorio">*</span></label>
                <input type="email" id="email" placeholder="alumno@ejemplo.com">
            </div>
            <div>
                <label>Fecha de Nacimiento <span class="obligatorio">*</span></label>
                <input type="date" id="fechaNacimiento">
            </div>
        </div>
    </div>

    <div class="grupo">
        <div class="fila">
            <div>
                <label>Teléfono Emergencia 1 <span class="obligatorio">*</span></label>
                <input type="tel" id="emergencia1" placeholder="Ej: 5559876543">
            </div>
            <div>
                <label>Teléfono Emergencia 2 (Opcional)</label>
                <input type="tel" id="emergencia2" placeholder="Ej: 5554567890">
            </div>
        </div>
    </div>

    <div class="grupo">
        <div class="fila">
            <div>
                <label>Disciplina <span class="obligatorio">*</span></label>
                <select id="disciplina">
                    <option value="">Selecciona...</option>
                    <option value="ENTRENAMIENTO FUNCIONAL">ENTRENAMIENTO FUNCIONAL</option>
                    <option value="ZUMBA">ZUMBA</option>
                    <option value="PILATES">PILATES</option>
                    <option value="TAEWONDO">TAEWONDO</option>
                    <option value="BOX">BOX</option>
                    <option value="KICK BOXING">KICK BOXING</option>
                </select>
            </div>
            <div>
                <label>Contraseña <span class="obligatorio">*</span></label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
            </div>
        </div>
    </div>

    <!-- Mostrar usuario generado -->
    <div id="infoUsuario" class="info-generado" style="display: none;">
        👤 Usuario generado: <strong id="usuarioGenerado"></strong>
    </div>

    <button onclick="registrarAlumno()">✅ REGISTRAR ALUMNO</button>

    <div id="mensaje" class="mensaje"></div>
</div>

<script>
    // La configuración de Firebase la hereda del panel-admin.html
    // Pero la declaramos por si se abre directamente
    if (typeof firebase === 'undefined') {
        const firebaseConfig = {
            apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
            authDomain: "balam-4e843.firebaseapp.com",
            projectId: "balam-4e843",
            storageBucket: "balam-4e843.firebasestorage.app",
            messagingSenderId: "633718462390",
            appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
        };
        firebase.initializeApp(firebaseConfig);
    }
    
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Generar usuario en tiempo real
    function generarUsuario() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const apellidoPaterno = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        
        if (nombre && apellidoPaterno) {
            const primeraLetraNombre = nombre.charAt(0);
            const usuario = primeraLetraNombre + apellidoPaterno;
            document.getElementById('usuarioGenerado').textContent = usuario;
            document.getElementById('infoUsuario').style.display = 'block';
            return usuario;
        } else {
            document.getElementById('infoUsuario').style.display = 'none';
            return null;
        }
    }

    // Escuchar cambios para generar usuario
    document.getElementById('nombre').addEventListener('input', generarUsuario);
    document.getElementById('apellidoPaterno').addEventListener('input', generarUsuario);

    async function registrarAlumno() {
        const nombre = document.getElementById('nombre').value.trim().toUpperCase();
        const apellidoPaterno = document.getElementById('apellidoPaterno').value.trim().toUpperCase();
        const apellidoMaterno = document.getElementById('apellidoMaterno').value.trim().toUpperCase();
        const telefono = document.getElementById('telefono').value.trim();
        const email = document.getElementById('email').value.trim();
        const fechaNacimiento = document.getElementById('fechaNacimiento').value;
        const emergencia1 = document.getElementById('emergencia1').value.trim();
        const emergencia2 = document.getElementById('emergencia2').value.trim();
        const disciplina = document.getElementById('disciplina').value;
        const password = document.getElementById('password').value;

        // Validar campos obligatorios
        if (!nombre || !apellidoPaterno || !apellidoMaterno || !telefono || !email || !fechaNacimiento || !emergencia1 || !disciplina || !password) {
            mostrarMensaje('❌ Todos los campos con * son obligatorios', 'error');
            return;
        }

        if (password.length < 6) {
            mostrarMensaje('❌ La contraseña debe tener al menos 6 caracteres', 'error');
            return;
        }

        const usuarioGenerado = generarUsuario();
        if (!usuarioGenerado) {
            mostrarMensaje('❌ Error generando usuario', 'error');
            return;
        }

        mostrarMensaje('⏳ Creando cuenta...', 'exito');

        try {
            // 1. Crear usuario en Firebase Auth
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const uid = userCredential.user.uid;

            // 2. Guardar todos los datos en Firestore
            const alumnoData = {
                uid: uid,
                usuario: usuarioGenerado,
                nombre: nombre,
                apellidoPaterno: apellidoPaterno,
                apellidoMaterno: apellidoMaterno,
                telefono: telefono,
                email: email,
                fechaNacimiento: fechaNacimiento,
                telefonoEmergencia1: emergencia1,
                telefonoEmergencia2: emergencia2 || '',
                disciplina: disciplina,
                rol: 'estudiante',
                fechaRegistro: firebase.firestore.FieldValue.serverTimestamp(),
                activo: true
            };

            await db.collection('alumnos').doc(uid).set(alumnoData);

            mostrarMensaje(`✅ Alumno registrado con éxito!<br>📧 Email: ${email}<br>👤 Usuario: ${usuarioGenerado}<br>🔑 Contraseña: La que asignaste`, 'exito');
            
            // Limpiar formulario (opcional)
            setTimeout(() => {
                limpiarFormulario();
            }, 3000);

        } catch (error) {
            console.error('Error:', error);
            let mensaje = '';
            switch (error.code) {
                case 'auth/email-already-in-use':
                    mensaje = '❌ Este email ya está registrado';
                    break;
                case 'auth/invalid-email':
                    mensaje = '❌ Email inválido';
                    break;
                case 'auth/weak-password':
                    mensaje = '❌ Contraseña muy débil';
                    break;
                default:
                    mensaje = '❌ Error: ' + error.message;
            }
            mostrarMensaje(mensaje, 'error');
        }
    }

    function mostrarMensaje(msg, tipo) {
        const divMensaje = document.getElementById('mensaje');
        divMensaje.innerHTML = msg;
        divMensaje.className = 'mensaje ' + tipo;
        divMensaje.style.display = 'block';
        setTimeout(() => {
            divMensaje.style.display = 'none';
        }, 5000);
    }

    function limpiarFormulario() {
        document.getElementById('nombre').value = '';
        document.getElementById('apellidoPaterno').value = '';
        document.getElementById('apellidoMaterno').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('email').value = '';
        document.getElementById('fechaNacimiento').value = '';
        document.getElementById('emergencia1').value = '';
        document.getElementById('emergencia2').value = '';
        document.getElementById('disciplina').value = '';
        document.getElementById('password').value = '';
        document.getElementById('infoUsuario').style.display = 'none';
    }
</script>

</body>
</html>
