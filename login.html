<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia BALAM - Iniciar Sesión</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            border: 1px solid #FFD700;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo img { max-width: 120px; height: auto; }
        h1 { color: #FFD700; text-align: center; font-size: 28px; margin-bottom: 5px; }
        .subtitulo { color: #CCCCCC; text-align: center; font-size: 14px; margin-bottom: 30px; border-bottom: 1px solid #FFD700; display: inline-block; width: auto; margin-left: auto; margin-right: auto; padding-bottom: 8px; }
        .input-group { margin-bottom: 25px; }
        label { display: block; color: #FFD700; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #2a2a2a;
            border: 1px solid #555555;
            border-radius: 10px;
            color: #FFFFFF;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus { outline: none; border-color: #FFD700; box-shadow: 0 0 8px rgba(255, 215, 0, 0.3); background: #333333; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4); }
        .mensaje-error { background: rgba(255, 0, 0, 0.2); border: 1px solid #FF4444; color: #FF8888; padding: 12px; border-radius: 10px; margin-top: 20px; text-align: center; display: none; }
        .mensaje-cargando { color: #FFD700; text-align: center; margin-top: 20px; display: none; }
        .info { text-align: center; margin-top: 25px; color: #888888; font-size: 12px; }
        .opciones-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .opcion-badge {
            background: #2a2a2a;
            color: #888;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #444;
        }
        .disciplinas { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 25px; padding-top: 20px; border-top: 1px solid #333333; }
        .badge { background: #2a2a2a; color: #FFD700; padding: 5px 12px; border-radius: 20px; font-size: 11px; border: 1px solid #FFD700; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <img src="logo.png" alt="Logo Academia BALAM" onerror="this.style.display='none'">
    </div>
    <h1>ACADEMIA BALAM</h1>
    <div style="text-align: center;"><div class="subtitulo">Iniciar Sesión</div></div>

    <div class="input-group">
        <label>📧 Usuario, Email o Teléfono</label>
        <input type="text" id="identificador" placeholder="Ej: ELUGO, usuario@email.com o 5551234567">
    </div>

    <div class="input-group">
        <label>🔒 Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button onclick="iniciarSesion()">INGRESAR</button>

    <div class="opciones-login">
        <span class="opcion-badge">👤 Usuario (ELUGO)</span>
        <span class="opcion-badge">📧 Correo electrónico</span>
        <span class="opcion-badge">📱 Teléfono</span>
    </div>

    <div id="mensajeError" class="mensaje-error"></div>
    <div id="mensajeCargando" class="mensaje-cargando">Verificando credenciales...</div>

    <div class="info">⚡ Acceso exclusivo para personal y estudiantes</div>
    <div class="disciplinas">
        <span class="badge">KICK BOXING</span>
        <span class="badge">BOX</span>
        <span class="badge">TAEWONDO</span>
        <span class="badge">PILATES</span>
        <span class="badge">ZUMBA</span>
        <span class="badge">ENTRENAMIENTO FUNCIONAL</span>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const identificadorInput = document.getElementById('identificador');
    const passwordInput = document.getElementById('password');
    const mensajeError = document.getElementById('mensajeError');
    const mensajeCargando = document.getElementById('mensajeCargando');

    // Función para buscar un usuario por su identificador (usuario, email o teléfono)
    async function buscarUsuarioPorIdentificador(identificador) {
        let emailEncontrado = null;
        let uidEncontrado = null;
        let rolEncontrado = null;

        // Caso 1: Si el identificador parece un email (contiene @)
        if (identificador.includes('@')) {
            console.log('Buscando por email:', identificador);
            return { email: identificador, metodo: 'email' };
        }

        // Caso 2: Buscar en la colección ALUMNOS por usuario o teléfono
        const alumnosQueryUsuario = await db.collection('alumnos')
            .where('usuario', '==', identificador.toUpperCase())
            .get();
        
        if (!alumnosQueryUsuario.empty) {
            const alumnoDoc = alumnosQueryUsuario.docs[0];
            emailEncontrado = alumnoDoc.data().email;
            uidEncontrado = alumnoDoc.id;
            rolEncontrado = 'estudiante';
            console.log('Usuario encontrado por nombre de usuario:', identificador);
            return { email: emailEncontrado, uid: uidEncontrado, rol: rolEncontrado };
        }

        // Caso 3: Buscar en alumnos por teléfono
        const alumnosQueryTelefono = await db.collection('alumnos')
            .where('telefono', '==', identificador)
            .get();
        
        if (!alumnosQueryTelefono.empty) {
            const alumnoDoc = alumnosQueryTelefono.docs[0];
            emailEncontrado = alumnoDoc.data().email;
            uidEncontrado = alumnoDoc.id;
            rolEncontrado = 'estudiante';
            console.log('Usuario encontrado por teléfono:', identificador);
            return { email: emailEncontrado, uid: uidEncontrado, rol: rolEncontrado };
        }

        // Caso 4: Buscar en AUXILIARES por email o teléfono
        const auxiliaresQuery = await db.collection('auxiliares')
            .where('email', '==', identificador)
            .get();
        
        if (!auxiliaresQuery.empty) {
            const auxDoc = auxiliaresQuery.docs[0];
            emailEncontrado = auxDoc.data().email;
            uidEncontrado = auxDoc.id;
            rolEncontrado = 'auxiliar';
            console.log('Auxiliar encontrado por email:', identificador);
            return { email: emailEncontrado, uid: uidEncontrado, rol: rolEncontrado };
        }

        // Caso 5: Buscar en ADMINISTRADORES por email
        const adminQuery = await db.collection('administradores')
            .where('Email', '==', identificador)
            .get();
        
        if (!adminQuery.empty) {
            const adminDoc = adminQuery.docs[0];
            emailEncontrado = adminDoc.data().Email;
            uidEncontrado = adminDoc.id;
            rolEncontrado = 'administrador';
            console.log('Administrador encontrado por email:', identificador);
            return { email: emailEncontrado, uid: uidEncontrado, rol: rolEncontrado };
        }

        // Si no se encontró nada, asumimos que es un email normal
        if (identificador.includes('@')) {
            return { email: identificador, metodo: 'email' };
        }

        return null;
    }

    window.iniciarSesion = async function() {
        const identificador = identificadorInput.value.trim();
        const password = passwordInput.value;

        if (!identificador || !password) {
            mostrarError('Por favor, completa todos los campos');
            return;
        }

        document.querySelector('button').disabled = true;
        mensajeCargando.style.display = 'block';
        mensajeError.style.display = 'none';

        try {
            // Buscar el email asociado al identificador
            const resultado = await buscarUsuarioPorIdentificador(identificador);
            
            if (!resultado || !resultado.email) {
                mostrarError('❌ Usuario no encontrado. Verifica tu usuario, email o teléfono');
                document.querySelector('button').disabled = false;
                mensajeCargando.style.display = 'none';
                return;
            }

            const emailLogin = resultado.email;
            console.log('Intentando login con email:', emailLogin);

            // Intentar autenticar con Firebase Auth
            const userCredential = await auth.signInWithEmailAndPassword(emailLogin, password);
            const user = userCredential.user;
            const uid = user.uid;

            let rol = null;

            // Si ya tenemos el rol de la búsqueda, usarlo
            if (resultado.rol) {
                rol = resultado.rol;
            } else {
                // Buscar en administradores
                const adminDoc = await db.collection('administradores').doc(uid).get();
                if (adminDoc.exists) {
                    rol = adminDoc.data().Rol || adminDoc.data().rol;
                }

                // Buscar en auxiliares
                if (!rol) {
                    const auxDoc = await db.collection('auxiliares').doc(uid).get();
                    if (auxDoc.exists) {
                        rol = auxDoc.data().Rol || auxDoc.data().rol || 'auxiliar';
                    }
                }

                // Buscar en alumnos
                if (!rol) {
                    const alumnoDoc = await db.collection('alumnos').doc(uid).get();
                    if (alumnoDoc.exists) {
                        rol = 'estudiante';
                    }
                }
            }

            // Redirigir según el rol
            if (rol === 'administrador') {
                window.location.href = 'panel-admin.html';
            } else if (rol === 'auxiliar') {
                window.location.href = 'panel-auxiliar.html';
            } else if (rol === 'estudiante') {
                window.location.href = 'panel-estudiante.html';
            } else {
                mostrarError('Usuario sin rol asignado. Contacta al administrador.');
                await auth.signOut();
            }

        } catch (error) {
            console.error('Error detallado:', error);
            let mensaje = '';
            switch (error.code) {
                case 'auth/user-not-found':
                    mensaje = '❌ Usuario o contraseña incorrectos';
                    break;
                case 'auth/wrong-password':
                    mensaje = '❌ Contraseña incorrecta';
                    break;
                case 'auth/invalid-email':
                    mensaje = '❌ Formato de email inválido';
                    break;
                default:
                    mensaje = '❌ Error: ' + error.message;
            }
            mostrarError(mensaje);
        } finally {
            document.querySelector('button').disabled = false;
            mensajeCargando.style.display = 'none';
        }
    };

    function mostrarError(mensaje) {
        mensajeError.textContent = mensaje;
        mensajeError.style.display = 'block';
        setTimeout(() => {
            mensajeError.style.display = 'none';
        }, 5000);
    }

    identificadorInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.iniciarSesion(); });
    passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.iniciarSesion(); });
</script>

</body>
</html>
