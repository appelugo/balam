<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Iniciar Sesión - Academia</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .login-container {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            border: 1px solid #FFD700;
            transition: all 0.3s ease;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo img {
            max-width: 80px;
            height: auto;
        }

        /* Título */
        .subtitulo {
            color: #FFD700;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        /* Campos */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #FFD700;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
            background: #333;
        }

        input::placeholder {
            color: #666;
        }

        /* Botón */
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Mensajes */
        .mensaje-error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 10px;
            border-radius: 12px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .mensaje-cargando {
            color: #FFD700;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            display: none;
        }

        /* Badges de opciones */
        .opciones-login {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .opcion-badge {
            background: #252525;
            color: #aaa;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #333;
        }

        /* Info extra */
        .info {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 11px;
        }

        /* Responsive: pantallas muy pequeñas */
        @media (max-width: 480px) {
            .login-container {
                padding: 24px 20px;
            }
            .subtitulo {
                font-size: 18px;
                margin-bottom: 24px;
            }
            input {
                padding: 10px 12px;
                font-size: 14px;
            }
            button {
                padding: 10px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Logo -->
    <div class="logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>

    <!-- Título simple -->
    <div class="subtitulo">Iniciar Sesión</div>

    <!-- Campos -->
    <div class="input-group">
        <label>📧 Usuario, Email o Teléfono</label>
        <input type="text" id="identificador" placeholder="Ej: ELUGO, correo@ejemplo.com o 5512345678">
    </div>

    <div class="input-group">
        <label>🔒 Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button onclick="iniciarSesion()">INGRESAR</button>

    <!-- Badges informativos -->
    <div class="opciones-login">
        <span class="opcion-badge">👤 Usuario</span>
        <span class="opcion-badge">📧 Correo</span>
        <span class="opcion-badge">📱 Teléfono</span>
    </div>

    <div id="mensajeError" class="mensaje-error"></div>
    <div id="mensajeCargando" class="mensaje-cargando">Verificando credenciales...</div>

    <div class="info">
        ⚡ Acceso para personal y estudiantes
    </div>
</div>

<script>
    // Configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const identificadorInput = document.getElementById('identificador');
    const passwordInput = document.getElementById('password');
    const mensajeError = document.getElementById('mensajeError');
    const mensajeCargando = document.getElementById('mensajeCargando');

    // Función para buscar en TODAS las colecciones (administradores, auxiliares, alumnos)
    async function buscarUsuarioPorIdentificador(identificador) {
        console.log('Buscando identificador:', identificador);
        
        // 1. Si es email, lo devolvemos directamente
        if (identificador.includes('@')) {
            return { email: identificador, tipo: 'email' };
        }

        // 2. Buscar en ADMINISTRADORES por usuario o telefono
        let queryAdminUser = await db.collection('administradores').where('usuario', '==', identificador.toUpperCase()).get();
        if (!queryAdminUser.empty) {
            let doc = queryAdminUser.docs[0];
            return { email: doc.data().Email, uid: doc.id, rol: 'administrador' };
        }

        let queryAdminTel = await db.collection('administradores').where('telefono', '==', identificador).get();
        if (!queryAdminTel.empty) {
            let doc = queryAdminTel.docs[0];
            return { email: doc.data().Email, uid: doc.id, rol: 'administrador' };
        }

        // 3. Buscar en AUXILIARES por usuario o telefono
        let queryAuxUser = await db.collection('auxiliares').where('usuario', '==', identificador.toUpperCase()).get();
        if (!queryAuxUser.empty) {
            let doc = queryAuxUser.docs[0];
            return { email: doc.data().email, uid: doc.id, rol: 'auxiliar' };
        }

        let queryAuxTel = await db.collection('auxiliares').where('telefono', '==', identificador).get();
        if (!queryAuxTel.empty) {
            let doc = queryAuxTel.docs[0];
            return { email: doc.data().email, uid: doc.id, rol: 'auxiliar' };
        }

        // 4. Buscar en ALUMNOS por usuario o telefono
        let queryAlumUser = await db.collection('alumnos').where('usuario', '==', identificador.toUpperCase()).get();
        if (!queryAlumUser.empty) {
            let doc = queryAlumUser.docs[0];
            return { email: doc.data().email, uid: doc.id, rol: 'estudiante' };
        }

        let queryAlumTel = await db.collection('alumnos').where('telefono', '==', identificador).get();
        if (!queryAlumTel.empty) {
            let doc = queryAlumTel.docs[0];
            return { email: doc.data().email, uid: doc.id, rol: 'estudiante' };
        }

        return null;
    }

    window.iniciarSesion = async function() {
        const identificador = identificadorInput.value.trim();
        const password = passwordInput.value;

        if (!identificador || !password) {
            mostrarError('Completa todos los campos');
            return;
        }

        document.querySelector('button').disabled = true;
        mensajeCargando.style.display = 'block';
        mensajeError.style.display = 'none';

        try {
            // Buscar el email según el identificador
            const resultado = await buscarUsuarioPorIdentificador(identificador);
            
            if (!resultado || !resultado.email) {
                mostrarError('❌ Usuario no encontrado');
                document.querySelector('button').disabled = false;
                mensajeCargando.style.display = 'none';
                return;
            }

            console.log('Email encontrado:', resultado.email);
            
            // Autenticar con Firebase Auth
            const userCredential = await auth.signInWithEmailAndPassword(resultado.email, password);
            const user = userCredential.user;
            const uid = user.uid;

            let rol = resultado.rol || null;

            // Si no tenemos rol, buscarlo
            if (!rol) {
                const adminDoc = await db.collection('administradores').doc(uid).get();
                if (adminDoc.exists) rol = adminDoc.data().Rol || adminDoc.data().rol;
                
                if (!rol) {
                    const auxDoc = await db.collection('auxiliares').doc(uid).get();
                    if (auxDoc.exists) rol = 'auxiliar';
                }
                
                if (!rol) {
                    const alumnoDoc = await db.collection('alumnos').doc(uid).get();
                    if (alumnoDoc.exists) rol = 'estudiante';
                }
            }

            // Redirigir según rol
            if (rol === 'administrador') {
                window.location.href = 'panel-admin.html';
            } else if (rol === 'auxiliar') {
                window.location.href = 'panel-auxiliar.html';
            } else if (rol === 'estudiante') {
                window.location.href = 'panel-estudiante.html';
            } else {
                mostrarError('Rol no identificado');
                await auth.signOut();
            }

        } catch (error) {
            console.error(error);
            let mensaje = '';
            switch (error.code) {
                case 'auth/user-not-found': mensaje = '❌ Usuario o contraseña incorrectos'; break;
                case 'auth/wrong-password': mensaje = '❌ Contraseña incorrecta'; break;
                case 'auth/invalid-email': mensaje = '❌ Email inválido'; break;
                default: mensaje = '❌ Error: ' + error.message;
            }
            mostrarError(mensaje);
        } finally {
            document.querySelector('button').disabled = false;
            mensajeCargando.style.display = 'none';
        }
    };

    function mostrarError(mensaje) {
        mensajeError.textContent = mensaje;
        mensajeError.style.display = 'block';
        setTimeout(() => {
            mensajeError.style.display = 'none';
        }, 4000);
    }

    identificadorInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.iniciarSesion(); });
    passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.iniciarSesion(); });
</script>

</body>
</html>
