<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Iniciar Sesión - Academia</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .login-container {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            border: 1px solid #FFD700;
            transition: all 0.3s ease;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo img {
            max-width: 80px;
            height: auto;
        }

        .subtitulo {
            color: #FFD700;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        /* Selector de modo */
        .modo-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .modo-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #aaa;
            font-size: 14px;
        }

        .modo-btn.active {
            background: #FFD700;
            border-color: #FFD700;
            color: #000;
            font-weight: bold;
        }

        .modo-btn.active .modo-icon {
            filter: none;
        }

        .modo-icon {
            font-size: 18px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #FFD700;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
            background: #333;
        }

        input::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .mensaje-error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 10px;
            border-radius: 12px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .mensaje-cargando {
            color: #FFD700;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            display: none;
        }

        .info {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px 20px;
            }
            .modo-btn {
                padding: 6px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>

    <div class="subtitulo">INICIAR SESIÓN</div>

    <!-- Selector de modo -->
    <div class="modo-selector">
        <div class="modo-btn" id="modoUsuario" onclick="setModo('')">
            <span class="modo-icon">👤</span> Usuario
        </div>
        <div class="modo-btn" id="modoCorreo" onclick="setModo('')">
            <span class="modo-icon">📧</span> Correo
        </div>
        <div class="modo-btn" id="modoTelefono" onclick="setModo('')">
            <span class="modo-icon">📱</span> Teléfono
        </div>
    </div>

    <div class="input-group">
        <label id="labelIdentificador">👤 USUARIO</label>
        <input type="text" id="identificador" placeholder="" autocomplete="off">
    </div>

    <div class="input-group">
        <label>🔒 CONTRASEÑA</label>
        <input type="password" id="password" placeholder="">
    </div>

    <button onclick="iniciarSesion()">INGRESAR</button>

    <div id="mensajeError" class="mensaje-error"></div>
    <div id="mensajeCargando" class="mensaje-cargando">Verificando credenciales...</div>

    <div class="info">
        ACCESO EXCLUSIVO PARA PERSONAL Y ESTUDIANTES
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let modoActual = 'usuario'; // usuario, correo, telefono

    const identificadorInput = document.getElementById('identificador');
    const passwordInput = document.getElementById('password');
    const mensajeError = document.getElementById('mensajeError');
    const mensajeCargando = document.getElementById('mensajeCargando');
    const labelIdentificador = document.getElementById('labelIdentificador');

    function setModo(modo) {
        modoActual = modo;
        
        // Actualizar estilos de los botones
        document.getElementById('modoUsuario').classList.remove('active');
        document.getElementById('modoCorreo').classList.remove('active');
        document.getElementById('modoTelefono').classList.remove('active');
        
        if (modo === 'usuario') {
            document.getElementById('modoUsuario').classList.add('active');
            labelIdentificador.innerHTML = '👤 USUARIO';
            identificadorInput.placeholder = 'Ej: ELUGO';
            identificadorInput.value = '';
            identificadorInput.style.textTransform = 'uppercase';
            identificadorInput.type = 'text';
        } else if (modo === 'correo') {
            document.getElementById('modoCorreo').classList.add('active');
            labelIdentificador.innerHTML = '📧 CORREO ELECTRÓNICO';
            identificadorInput.placeholder = 'ejemplo@correo.com';
            identificadorInput.value = '';
            identificadorInput.style.textTransform = 'none';
            identificadorInput.type = 'email';
        } else if (modo === 'telefono') {
            document.getElementById('modoTelefono').classList.add('active');
            labelIdentificador.innerHTML = '📱 TELÉFONO';
            identificadorInput.placeholder = '5512345678';
            identificadorInput.value = '';
            identificadorInput.style.textTransform = 'none';
            identificadorInput.type = 'tel';
        }
        
        identificadorInput.focus();
    }

    // Convertir a mayúsculas SOLO en modo usuario
    identificadorInput.addEventListener('input', function() {
        if (modoActual === 'usuario') {
            this.value = this.value.toUpperCase();
        } else if (modoActual === 'telefono') {
            this.value = this.value.replace(/[^0-9]/g, '');
        }
        // En modo correo, NO se modifica nada
    });

    async function buscarUsuarioPorIdentificador(identificador, modo) {
        console.log(`🔍 Buscando por ${modo}:`, identificador);
        
        if (modo === 'correo') {
            return { email: identificador.toLowerCase(), tipo: 'email' };
        }
        
        if (modo === 'usuario') {
            // Buscar en ADMINISTRADORES por usuario
            let query = await db.collection('administradores').where('usuario', '==', identificador).get();
            if (!query.empty) {
                let doc = query.docs[0];
                return { email: doc.data().Email, uid: doc.id, rol: 'administrador' };
            }
            // Buscar en AUXILIARES por usuario
            query = await db.collection('auxiliares').where('usuario', '==', identificador).get();
            if (!query.empty) {
                let doc = query.docs[0];
                return { email: doc.data().email, uid: doc.id, rol: 'auxiliar' };
            }
            // Buscar en ALUMNOS por usuario
            query = await db.collection('alumnos').where('usuario', '==', identificador).get();
            if (!query.empty) {
                let doc = query.docs[0];
                return { email: doc.data().email, uid: doc.id, rol: 'estudiante' };
            }
        }
        
        if (modo === 'telefono') {
            // Buscar en ADMINISTRADORES por teléfono
            let query = await db.collection('administradores').where('telefono', '==', identificador).get();
            if (!query.empty) {
                let doc = query.docs[0];
                return { email: doc.data().Email, uid: doc.id, rol: 'administrador' };
            }
            // Buscar en AUXILIARES por teléfono
            query = await db.collection('auxiliares').where('telefono', '==', identificador).get();
            if (!query.empty) {
                let doc = query.docs[0];
                return { email: doc.data().email, uid: doc.id, rol: 'auxiliar' };
            }
            // Buscar en ALUMNOS por teléfono
            query = await db.collection('alumnos').where('telefono', '==', identificador).get();
            if (!query.empty) {
                let doc = query.docs[0];
                return { email: doc.data().email, uid: doc.id, rol: 'estudiante' };
            }
        }
        
        return null;
    }

    window.iniciarSesion = async function() {
        let identificador = identificadorInput.value.trim();
        const password = passwordInput.value;

        if (!identificador || !password) {
            mostrarError('COMPLETA TODOS LOS CAMPOS');
            return;
        }

        document.querySelector('button').disabled = true;
        mensajeCargando.style.display = 'block';
        mensajeError.style.display = 'none';

        try {
            const resultado = await buscarUsuarioPorIdentificador(identificador, modoActual);
            
            if (!resultado || !resultado.email) {
                mostrarError('❌ USUARIO NO ENCONTRADO');
                document.querySelector('button').disabled = false;
                mensajeCargando.style.display = 'none';
                return;
            }

            console.log('📧 Intentando login con:', resultado.email);
            
            const userCredential = await auth.signInWithEmailAndPassword(resultado.email, password);
            const user = userCredential.user;
            const uid = user.uid;

            let rol = resultado.rol || null;

            if (!rol) {
                const adminDoc = await db.collection('administradores').doc(uid).get();
                if (adminDoc.exists) rol = 'administrador';
                if (!rol) {
                    const auxDoc = await db.collection('auxiliares').doc(uid).get();
                    if (auxDoc.exists) rol = 'auxiliar';
                }
                if (!rol) {
                    const alumnoDoc = await db.collection('alumnos').doc(uid).get();
                    if (alumnoDoc.exists) rol = 'estudiante';
                }
            }

            if (rol === 'administrador') {
                window.location.href = 'panel-admin.html';
            } else if (rol === 'auxiliar') {
                window.location.href = 'panel-auxiliar.html';
            } else if (rol === 'estudiante') {
                window.location.href = 'panel-estudiante.html';
            } else {
                mostrarError('ROL NO IDENTIFICADO');
                await auth.signOut();
            }

        } catch (error) {
            console.error('❌ Error:', error);
            let mensaje = '';
            switch (error.code) {
                case 'auth/invalid-login-credentials':
                    mensaje = '❌ USUARIO O CONTRASEÑA INCORRECTOS';
                    break;
                default:
                    mensaje = '❌ ERROR: ' + error.message;
            }
            mostrarError(mensaje);
        } finally {
            document.querySelector('button').disabled = false;
            mensajeCargando.style.display = 'none';
        }
    };

    function mostrarError(mensaje) {
        mensajeError.textContent = mensaje;
        mensajeError.style.display = 'block';
        setTimeout(() => {
            mensajeError.style.display = 'none';
        }, 4000);
    }

    identificadorInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.iniciarSesion(); });
    passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.iniciarSesion(); });
    
    // Inicializar modo usuario por defecto
    setModo('usuario');
</script>

</body>
</html>
