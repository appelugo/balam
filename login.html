<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Iniciar Sesión - Academia</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .login-container {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            border: 1px solid #FFD700;
            transition: all 0.3s ease;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo img {
            max-width: 80px;
            height: auto;
        }

        .subtitulo {
            color: #FFD700;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #FFD700;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
            background: #333;
        }

        input::placeholder {
            color: #666;
            text-transform: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .mensaje-error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 10px;
            border-radius: 12px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .mensaje-cargando {
            color: #FFD700;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            display: none;
        }

        .info {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px 20px;
            }
            .subtitulo {
                font-size: 18px;
                margin-bottom: 24px;
            }
            input {
                padding: 10px 12px;
                font-size: 14px;
            }
            button {
                padding: 10px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>

    <div class="subtitulo">INICIAR SESIÓN</div>

    <div class="input-group">
        <label>USUARIO, EMAIL O TELÉFONO</label>
        <input type="text" id="identificador" placeholder="" style="text-transform: uppercase;">
    </div>

    <div class="input-group">
        <label>CONTRASEÑA</label>
        <input type="password" id="password" placeholder="">
    </div>

    <button onclick="iniciarSesion()">INGRESAR</button>

    <div id="mensajeError" class="mensaje-error"></div>
    <div id="mensajeCargando" class="mensaje-cargando">Verificando credenciales...</div>

    <div class="info">
        ACCESO EXCLUSIVO PARA PERSONAL Y ESTUDIANTES
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtlEE7cmyjWvppnO9JDu1A3OsNxpCr5Nc",
        authDomain: "balam-4e843.firebaseapp.com",
        projectId: "balam-4e843",
        storageBucket: "balam-4e843.firebasestorage.app",
        messagingSenderId: "633718462390",
        appId: "1:633718462390:web:aaefbe4bf1cc3917fc5317"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const identificadorInput = document.getElementById('identificador');
    const passwordInput = document.getElementById('password');
    const mensajeError = document.getElementById('mensajeError');
    const mensajeCargando = document.getElementById('mensajeCargando');

    // Convertir a mayúsculas mientras escribe (solo el identificador)
    identificadorInput.addEventListener('input', function() {
        this.value = this.value.toUpperCase();
    });

    async function buscarUsuarioPorIdentificador(identificador) {
        console.log('🔍 Buscando:', identificador);
        
        // Si es email (contiene @ y minúsculas), no convertir
        if (identificador.includes('@')) {
            return { email: identificador.toLowerCase(), tipo: 'email' };
        }

        // Buscar en ADMINISTRADORES por usuario o telefono
        let queryAdminUser = await db.collection('administradores').where('usuario', '==', identificador).get();
        if (!queryAdminUser.empty) {
            let doc = queryAdminUser.docs[0];
            console.log('✅ Admin encontrado por usuario');
            return { email: doc.data().Email, uid: doc.id, rol: 'administrador' };
        }

        let queryAdminTel = await db.collection('administradores').where('telefono', '==', identificador).get();
        if (!queryAdminTel.empty) {
            let doc = queryAdminTel.docs[0];
            console.log('✅ Admin encontrado por teléfono');
            return { email: doc.data().Email, uid: doc.id, rol: 'administrador' };
        }

        // Buscar en AUXILIARES
        let queryAuxUser = await db.collection('auxiliares').where('usuario', '==', identificador).get();
        if (!queryAuxUser.empty) {
            let doc = queryAuxUser.docs[0];
            console.log('✅ Auxiliar encontrado');
            return { email: doc.data().email, uid: doc.id, rol: 'auxiliar' };
        }

        let queryAuxTel = await db.collection('auxiliares').where('telefono', '==', identificador).get();
        if (!queryAuxTel.empty) {
            let doc = queryAuxTel.docs[0];
            console.log('✅ Auxiliar encontrado por teléfono');
            return { email: doc.data().email, uid: doc.id, rol: 'auxiliar' };
        }

        // Buscar en ALUMNOS
        let queryAlumUser = await db.collection('alumnos').where('usuario', '==', identificador).get();
        if (!queryAlumUser.empty) {
            let doc = queryAlumUser.docs[0];
            console.log('✅ Alumno encontrado por usuario');
            return { email: doc.data().email, uid: doc.id, rol: 'estudiante' };
        }

        let queryAlumTel = await db.collection('alumnos').where('telefono', '==', identificador).get();
        if (!queryAlumTel.empty) {
            let doc = queryAlumTel.docs[0];
            console.log('✅ Alumno encontrado por teléfono');
            return { email: doc.data().email, uid: doc.id, rol: 'estudiante' };
        }

        return null;
    }

    window.iniciarSesion = async function() {
        let identificador = identificadorInput.value.trim();
        const password = passwordInput.value;

        if (!identificador || !password) {
            mostrarError('COMPLETA TODOS LOS CAMPOS');
            return;
        }

        // Si no es email, convertir a mayúsculas para búsqueda
        if (!identificador.includes('@')) {
            identificador = identificador.toUpperCase();
        }

        document.querySelector('button').disabled = true;
        mensajeCargando.style.display = 'block';
        mensajeError.style.display = 'none';

        try {
            const resultado = await buscarUsuarioPorIdentificador(identificador);
            
            if (!resultado || !resultado.email) {
                mostrarError('❌ USUARIO NO ENCONTRADO');
                document.querySelector('button').disabled = false;
                mensajeCargando.style.display = 'none';
                return;
            }

            console.log('📧 Intentando login con:', resultado.email);
            
            const userCredential = await auth.signInWithEmailAndPassword(resultado.email, password);
            const user = userCredential.user;
            const uid = user.uid;

            let rol = resultado.rol || null;

            if (!rol) {
                const adminDoc = await db.collection('administradores').doc(uid).get();
                if (adminDoc.exists) rol = adminDoc.data().Rol || adminDoc.data().rol;
                
                if (!rol) {
                    const auxDoc = await db.collection('auxiliares').doc(uid).get();
                    if (auxDoc.exists) rol = 'auxiliar';
                }
                
                if (!rol) {
                    const alumnoDoc = await db.collection('alumnos').doc(uid).get();
                    if (alumnoDoc.exists) rol = 'estudiante';
                }
            }

            if (rol === 'administrador') {
                window.location.href = 'panel-admin.html';
            } else if (rol === 'auxiliar') {
                window.location.href = 'panel-auxiliar.html';
            } else if (rol === 'estudiante') {
                window.location.href = 'panel-estudiante.html';
            } else {
                mostrarError('ROL NO IDENTIFICADO');
                await auth.signOut();
            }

        } catch (error) {
            console.error('❌ Error:', error);
            let mensaje = '';
            switch (error.code) {
                case 'auth/invalid-login-credentials':
                    mensaje = '❌ USUARIO O CONTRASEÑA INCORRECTOS';
                    break;
                case 'auth/user-not-found':
                    mensaje = '❌ USUARIO NO ENCONTRADO';
                    break;
                case 'auth/wrong-password':
                    mensaje = '❌ CONTRASEÑA INCORRECTA';
                    break;
                case 'auth/invalid-email':
                    mensaje = '❌ EMAIL INVÁLIDO';
                    break;
                default:
                    mensaje = '❌ ERROR: ' + error.message;
            }
            mostrarError(mensaje);
        } finally {
            document.querySelector('button').disabled = false;
            mensajeCargando.style.display = 'none';
        }
    };

    function mostrarError(mensaje) {
        mensajeError.textContent = mensaje;
        mensajeError.style.display = 'block';
        setTimeout(() => {
            mensajeError.style.display = 'none';
        }, 4000);
    }

    identificadorInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.iniciarSesion(); });
    passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.iniciarSesion(); });
</script>

</body>
</html>
